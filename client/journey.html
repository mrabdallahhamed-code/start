<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub active"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="messages.html" class="side-link"><span class="ic">💬</span> الرسائل</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">رحلة الطلب</h1>
        <div class="card" id="journeyArea"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);

  const requestIdParam = new URLSearchParams(window.location.search).get('request_id');
  let query = supabase.from('service_requests').select('id, status').eq('client_id', profile.id);
  query = requestIdParam ? query.eq('id', requestIdParam) : query.order('created_at', {ascending:false}).limit(1);
  const { data: requests } = await query;
  const area = document.getElementById('journeyArea');

  if(!requests || !requests.length){
    area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">ما عندك طلب تأسيس حالياً — رحلة الطلب تظهر بعد ما تطلب عروض ويوافَق على عرض.</p>';
    return;
  }

  const { data: offers } = await supabase.from('offers').select('id, status').eq('request_id', requests[0].id);
  const accepted = offers && offers.some(o => o.status === 'accepted');

  if(!accepted){
    area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">رحلة الطلب تبدأ بعد ما توافق على عرض من العروض الواردة. <a href="offers.html">شوف العروض</a></p>';
    return;
  }

  area.innerHTML = '<div id="stagesArea"></div>';
  loadStages(requests[0].id, 'stagesArea');
}

async function loadStages(requestId, containerId){
  const container = document.getElementById(containerId);
  const { data: req } = await supabase.from('service_requests').select('id, created_at, status, client_id').eq('id', requestId).single();
  const { data: offersData } = await supabase.from('offers').select('created_at, status').eq('request_id', requestId).order('created_at');
  const { data: clientData } = await supabase.from('clients').select('created_at, assessment_completed_at').eq('id', req.client_id).single();

  const autoStages = [
    { name:'تم التسجيل', done:true, date: clientData?.created_at },
    { name:'تم اعتماد طلبه', done: !!clientData?.assessment_completed_at, date: clientData?.assessment_completed_at },
    { name:'تم الرفع للعروض', done: req.status !== 'pending_admin_review', date: req.created_at },
    { name:'تم إرسال عروض', done: !!(offersData && offersData.length), date: offersData?.[0]?.created_at },
    { name:'اعتماد العروض', done: !!(offersData && offersData.some(o=>o.status==='accepted')), date: offersData?.find(o=>o.status==='accepted')?.created_at },
  ];

  const { data: stages } = await supabase.from('request_stages').select('*').eq('request_id', requestId).order('stage_order');

  let html = '<div class="timeline">';
  autoStages.forEach(s => {
    html += `<div class="tl-item ${s.done?'done':''}"><span class="tl-dot"></span><div class="tl-text"><strong>${s.name}</strong>${s.date?` <span class="tl-date">${new Date(s.date).toLocaleDateString('ar-SA')}</span>`:''}</div></div>`;
  });
  if(stages && stages.length){
    stages.forEach(s => {
      const cls = s.status === 'completed' ? 'done' : (s.status==='in_progress' ? 'active' : '');
      html += `<div class="tl-item ${cls}"><span class="tl-dot"></span><div class="tl-text"><strong>${s.stage_name}</strong>${s.completed_at?` <span class="tl-date">${new Date(s.completed_at).toLocaleDateString('ar-SA')}</span>`:''}</div></div>`;
    });
  }
  html += '</div>';
  container.innerHTML = html;
}

init();
</script>
</body>
</html>
