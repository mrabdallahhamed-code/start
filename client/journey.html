<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">
<title>رحلة الطلب — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .stage-card{border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; background:var(--white);}
  .stage-card.completed{background:var(--green-tint); border-color:var(--green-tint2);}
  .stage-card.waiting{background:#FFF8EC; border-color:#E8C77A; box-shadow:0 0 0 3px rgba(232,199,122,.25);}
  .stage-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .stage-head strong{font-size:14.5px;}
  .stage-status{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .stage-status.pending{background:var(--line-soft); color:var(--ink-soft);}
  .stage-status.in_progress{background:var(--gold-soft); color:var(--gold-deep);}
  .stage-status.waiting_client{background:#F5D98A; color:#7A5A0A;}
  .stage-status.completed{background:var(--green-tint2); color:var(--green-dark);}
  .note-box{background:var(--white); border:1px solid #E8C77A; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:13px;}
  .doc-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line-soft);}
  .upload-row{margin-top:10px;}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub active"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="messages.html" class="side-link"><span class="ic">💬</span> الرسائل</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner" style="max-width:620px;">
        <h1 class="page-title">رحلة الطلب</h1>
        <div id="journeyArea"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/i18n.js"></script>
<script>
let profile;
const statusLabels = { pending: 'لم تبدأ', in_progress: 'جاري العمل', waiting_client: 'بانتظار ردك', completed: 'مكتملة ✓' };

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
 try{
  initNotificationBell(profile.id);

  const requestIdParam = new URLSearchParams(window.location.search).get('request_id');
  let query = supabase.from('service_requests').select('id, status').eq('client_id', profile.id);
  query = requestIdParam ? query.eq('id', requestIdParam) : query.order('created_at', {ascending:false}).limit(1);
  const { data: requests, error: reqErr } = await query;
  const area = document.getElementById('journeyArea');
  if(reqErr) throw new Error('فشل جلب الطلب: ' + reqErr.message);

  if(!requests || !requests.length){
    area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">ما عندك طلب تأسيس حالياً.</p>';
    return;
  }

  const { data: offers } = await supabase.from('offers').select('id, status').eq('request_id', requests[0].id);
  const accepted = offers && offers.some(o => o.status === 'accepted');

  if(!accepted){
    area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">رحلة الطلب تبدأ بعد ما توافق على عرض من العروض الواردة. <a href="offers.html">شوف العروض</a></p>';
    return;
  }

  await loadStages(requests[0].id, area);
 } catch(err){
  document.getElementById('journeyArea').innerHTML = `<div style="background:#FCECEA;border:2px solid #B5442E;border-radius:10px;padding:16px;color:#7A3325;font-size:13px;"><strong>⚠ خطأ فعلي:</strong><br>${err.message || err}</div>`;
  console.error(err);
 }
}

async function loadStages(requestId, area){
  const { data: stages, error } = await supabase.from('request_stages').select('*').eq('request_id', requestId).order('stage_order');
  if(error){ area.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!stages || !stages.length){ area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">مراحل التنفيذ بتظهر هنا قريباً.</p>'; return; }

  let html = '';
  for(const s of stages){
    const cls = s.status === 'completed' ? 'completed' : (s.status === 'waiting_client' ? 'waiting' : '');
    const { data: docs } = await supabase.from('stage_documents').select('*').eq('stage_id', s.id).order('uploaded_at', {ascending:false});
    const { data: procs } = await supabase.from('stage_procedures').select('*').eq('stage_id', s.id).order('procedure_order');

    const procsHtml = (procs || []).map(p => `
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;">
        <span style="color:${p.is_done ? 'var(--green-dark)' : 'var(--ink-faint)'};">${p.is_done ? '✅' : '⬜'}</span>
        <span style="${p.is_done ? 'color:var(--ink-soft);' : 'color:var(--ink);'}">${p.procedure_name}</span>
      </div>`).join('');

    html += `<div class="stage-card ${cls}">
      <div class="stage-head">
        <strong>${s.stage_order}. ${s.stage_name}</strong>
        <span class="stage-status ${s.status}">${statusLabels[s.status] || s.status}</span>
      </div>
      ${procsHtml ? `<div style="background:var(--paper);border-radius:8px;padding:8px 12px;margin:8px 0;">${procsHtml}</div>` : ''}
      ${s.status === 'waiting_client' && s.admin_note ? `<div class="note-box">⚠️ <strong>فريق إتقان محتاج ردّك:</strong><br>${s.admin_note}</div>` : ''}
      ${s.client_reply_text ? `<div class="note-box" style="border-color:var(--green-tint2);background:var(--green-tint);"><strong>ردّك السابق:</strong><br>${s.client_reply_text}</div>` : ''}
      ${docs && docs.length ? docs.map(d => `<div class="doc-row"><span>📎 ${d.file_name || 'ملف'}</span><a href="#" onclick="downloadDoc('${d.file_path}');return false;" style="color:var(--green-dark);">تحميل</a></div>`).join('') : ''}
      ${s.status === 'waiting_client' ? `
        <div class="upload-row">
          <textarea id="reply-${s.id}" rows="2" placeholder="اكتب ردّك هنا (لو مو محتاج ترفع ملف)..." style="margin-bottom:8px;"></textarea>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn gold" style="padding:8px 16px;font-size:12.5px;" onclick="sendReply('${s.id}')">📝 إرسال الرد المكتوب</button>
            <label class="btn ghost" style="padding:8px 16px;font-size:12.5px;cursor:pointer;">📤 رفع ملف بدل ذلك<input type="file" style="display:none;" onchange="uploadDoc('${s.id}', this, '${requestId}')"></label>
          </div>
        </div>` : ''}
    </div>`;
  }
  area.innerHTML = html;
}

async function sendReply(stageId){
  const textarea = document.getElementById('reply-' + stageId);
  const text = textarea.value.trim();
  if(!text){ alert('اكتب ردّك أولاً'); return; }

  const { error } = await supabase.from('request_stages').update({
    client_reply_text: text, client_replied_at: new Date().toISOString()
  }).eq('id', stageId);
  if(error){ alert(error.message); return; }

  const { data: admins } = await supabase.from('profiles').select('id').eq('role','admin').limit(3);
  (admins||[]).forEach(a => createNotification(a.id, 'العميل ردّ على طلبك', text.slice(0,60), '../admin/requests.html'));

  init();
}

async function uploadDoc(stageId, input, requestId){
  if(!input.files.length) return;
  const file = input.files[0];
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const filePath = `${profile.id}/stage_${stageId}_${Date.now()}_${safeName}`;
  const { error: upErr } = await supabase.storage.from('offer-attachments').upload(filePath, file);
  if(upErr){ alert(upErr.message); return; }
  await supabase.from('stage_documents').insert({ stage_id: stageId, file_path: filePath, file_name: file.name, uploaded_by_role: 'client' });

  // إشعار الأدمن بوصول الرد
  const { data: admins } = await supabase.from('profiles').select('id').eq('role','admin').limit(3);
  (admins||[]).forEach(a => createNotification(a.id, 'العميل رفع ملف مطلوب', 'بانتظار مراجعتك', '../admin/requests.html'));

  init();
}

async function downloadDoc(filePath){
  const { data } = await supabase.storage.from('offer-attachments').createSignedUrl(filePath, 3600);
  if(data?.signedUrl) window.open(data.signedUrl, '_blank');
}

init();
</script>
</body>
</html>
