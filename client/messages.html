<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>الرسائل — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .msg-thread{max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; padding:4px;}
  .msg-bubble{max-width:75%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.6;}
  .msg-bubble.mine{background:linear-gradient(135deg, var(--green-light), var(--green)); color:var(--white); margin-right:auto; border-bottom-left-radius:4px;}
  .msg-bubble.theirs{background:var(--paper); border:1px solid var(--line-soft); margin-left:auto; border-bottom-right-radius:4px;}
  .msg-input-row{display:flex; gap:10px;}
  .msg-input-row input{flex:1; margin:0;}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="messages.html" class="side-link active"><span class="ic">💬</span> الرسائل</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner" style="max-width:640px;">
        <h1 class="page-title">الرسائل مع فريق إتقان</h1>
        <div class="card">
          <div class="msg-thread" id="msgThread"><p style="font-size:13px;color:var(--ink-soft);">جارٍ التحميل...</p></div>
          <div class="msg-input-row">
            <input id="msgInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMsg();">
            <button class="btn gold" style="margin:0;padding:12px 22px;" onclick="sendMsg()">إرسال</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/i18n.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadThread();
}

async function loadThread(){
  const { data, error } = await supabase.from('admin_messages').select('*').eq('recipient_id', profile.id).order('created_at');
  const thread = document.getElementById('msgThread');
  if(error){ thread.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ thread.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);text-align:center;padding:20px;">لا توجد رسائل بعد — ابدأ المحادثة بكتابة رسالة بالأسفل.</p>'; return; }

  thread.innerHTML = data.map(m => `<div class="msg-bubble ${m.sender_id === profile.id ? 'mine' : 'theirs'}">${m.message}</div>`).join('');
  thread.scrollTop = thread.scrollHeight;
}

async function sendMsg(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;

  const { data: admins } = await supabase.from('profiles').select('id').eq('role','admin').limit(1);
  if(!admins || !admins.length){ alert('تعذر تحديد جهة الإدارة'); return; }

  const { error } = await supabase.from('admin_messages').insert({ recipient_id: admins[0].id, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }

  input.value = '';
  loadThread();
  createNotification(admins[0].id, 'رسالة جديدة من عميل', text.slice(0,60), '../admin/client-detail.html?id=' + profile.id + '#messagesSection');
}

init();
</script>
</body>
</html>
