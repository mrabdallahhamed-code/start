<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile, assessmentDone, clientPath;
const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);

  const { data: client } = await supabase.from('clients').select('assessment_completed_at, incorporation_path').eq('id', profile.id).single();
  assessmentDone = !!client?.assessment_completed_at;
  clientPath = client?.incorporation_path || 'foreign_investment';

  loadRequests();
}

function handleNewRequestClick(){
  if(clientPath === 'saudi_national'){ window.location.href = 'status-assessment.html'; return; }
  if(!assessmentDone){ alert('فضلاً أكمل بوصلة الجاهزية أولاً للحصول على عروض.'); return; }
  window.location.href = 'request-offers.html';
}

async function loadRequests(){
  const list = document.getElementById('reqList');
  const { data: requests, error } = await supabase
    .from('service_requests')
    .select('*')
    .eq('client_id', profile.id)
    .order('created_at', {ascending:false});

  if(error){ list.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  if(!requests || !requests.length){ list.innerHTML = '<p class="txt-soft-lg">ما عندك أي طلب تأسيس حالياً.</p>'; return; }

  const statusMap = {
    pending_admin_review: 'قيد المراجعة — فريق إتقان يجهّز عرضك',
    open: 'وصلك عرض — بانتظار موافقتك',
    offer_selected: 'تم اختيار عرض',
    in_progress: 'قيد التنفيذ', completed: 'مكتمل', cancelled: 'ملغى'
  };

  const ENTITY_LABELS = { sole_proprietorship:'مؤسسة فردية', llc_single:'ذات مسؤولية محدودة (شخص واحد)', llc:'ذات مسؤولية محدودة',
    closed_jsc_single:'مساهمة مغلقة (شخص واحد)', closed_jsc:'مساهمة مغلقة', simplified_jsc:'مساهمة مبسطة', professional_company:'شركة مهنية' };

  list.innerHTML = requests.map(r => {
    const canEdit = r.status === 'pending_admin_review' && (Date.now() - new Date(r.created_at).getTime()) < TWO_HOURS_MS;
    const simamReady = r.simam_sync_status === 'synced';
    const isSaudiPath = r.path === 'saudi_national';
    const editHref = isSaudiPath ? `status-assessment.html?edit_id=${esc(r.id)}` : `request-offers.html?edit_id=${esc(r.id)}`;
    const subLine = isSaudiPath
      ? `نوع التأسيس: سعودي${r.entity_type_known ? ' — ' + esc(ENTITY_LABELS[r.saudi_entity_type] || r.saudi_entity_type || '—') : ' — نوع الكيان غير محدد'}`
      : `النشاط: ${esc(r.activity_type || '—')}`;
    return `
    <div class="list-item-card">
      <p style="font-size:14px;margin-bottom:4px;"><strong>${esc(statusMap[r.status] || r.status)}</strong></p>
      <p class="hint mb-12">${subLine} · تاريخ الطلب: ${esc(new Date(r.created_at).toLocaleDateString('ar-SA'))}</p>
      <a href="offers.html?request_id=${esc(r.id)}" class="btn ghost btn-sm-flush">عرض العروض</a>
      <a href="journey.html?request_id=${esc(r.id)}" class="btn ghost btn-sm-flush">رحلة الطلب</a>
      ${canEdit ? `<a href="${editHref}" class="btn gold btn-sm-flush">تعديل الطلب</a>` : ''}
      ${simamReady ? `<button onclick="goToSimam('${esc(r.id)}')" class="btn gold btn-sm-flush">🎉 الانتقال إلى صمام من إتقان لمتابعة خدماتك ←</button>` : ''}
    </div>`;
  }).join('');
}

async function goToSimam(requestId){
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'جارٍ تجهيز الدخول...';
  try{
    const { data, error: fnErr } = await supabase.functions.invoke('simam-login-link', { body: { requestId } });
    if(fnErr) throw fnErr;
    if(data.loginUrl){
      openSignedUrl(data.loginUrl);
    } else {
      alert('تعذر تجهيز الدخول التلقائي، جرّب تسجّل دخول يدوياً على simam.itqanbs.sa');
      window.open('https://simam.itqanbs.sa', '_blank', 'noopener,noreferrer');
    }
  } catch(e){
    window.open('https://simam.itqanbs.sa', '_blank', 'noopener,noreferrer');
  }
  btn.disabled = false; btn.textContent = '🎉 الانتقال إلى صمام من إتقان لمتابعة خدماتك ←';
}

init();
</script>
