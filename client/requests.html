<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>طلبات التأسيس — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub active"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="messages.html" class="side-link"><span class="ic">💬</span> الرسائل</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">طلبات التأسيس</h1>
        <button class="btn gold" onclick="handleNewRequestClick()">+ طلب عرض سعر جديد</button>
        <div id="reqList" style="margin-top:18px;"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile, assessmentDone;
const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);

  const { data: client } = await supabase.from('clients').select('assessment_completed_at').eq('id', profile.id).single();
  assessmentDone = !!client?.assessment_completed_at;

  loadRequests();
}

function handleNewRequestClick(){
  if(!assessmentDone){ alert('فضلاً أكمل بوصلة الجاهزية أولاً للحصول على عروض.'); return; }
  window.location.href = 'request-offers.html';
}

async function loadRequests(){
  const list = document.getElementById('reqList');
  const { data: requests, error } = await supabase
    .from('service_requests')
    .select('*')
    .eq('client_id', profile.id)
    .order('created_at', {ascending:false});

  if(error){ list.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!requests || !requests.length){ list.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">ما عندك أي طلب تأسيس حالياً.</p>'; return; }

  const statusMap = {
    pending_admin_review: 'قيد المراجعة — فريق إتقان يجهّز عرضك',
    open: 'وصلك عرض — بانتظار موافقتك',
    offer_selected: 'تم اختيار عرض',
    in_progress: 'قيد التنفيذ', completed: 'مكتمل', cancelled: 'ملغى'
  };

  list.innerHTML = requests.map(r => {
    const canEdit = r.status === 'pending_admin_review' && (Date.now() - new Date(r.created_at).getTime()) < TWO_HOURS_MS;
    return `
    <div class="list-item-card">
      <p style="font-size:14px;margin-bottom:4px;"><strong>${statusMap[r.status] || r.status}</strong></p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">النشاط: ${r.activity_type || '—'} · تاريخ الطلب: ${new Date(r.created_at).toLocaleDateString('ar-SA')}</p>
      <a href="offers.html?request_id=${r.id}" class="btn ghost" style="padding:7px 14px;font-size:12.5px;margin-top:0;">عرض العروض</a>
      <a href="journey.html?request_id=${r.id}" class="btn ghost" style="padding:7px 14px;font-size:12.5px;margin-top:0;">رحلة الطلب</a>
      ${canEdit ? `<a href="request-offers.html?edit_id=${r.id}" class="btn gold" style="padding:7px 14px;font-size:12.5px;margin-top:0;">تعديل الطلب</a>` : ''}
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
