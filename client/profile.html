<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/mubtada-mark.png" alt="مبتدأ" width="34" height="36" style="height:36px;width:auto;"><span class="brand-name">مبتدأ <small>من إتقان</small></span></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="profile.html" class="side-link active"><span class="ic">👤</span> بياناتي</a>
      <a href="messages.html" class="side-link"><span class="ic">💬</span> الرسائل</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner" style="max-width:520px;">
        <h1 class="page-title">بياناتي</h1>
        <div class="card">
          <label>الاسم الكامل</label>
          <input id="full_name">
          <label>البريد الإلكتروني</label>
          <input id="email" disabled style="opacity:.6;">
          <label>رقم الجوال (مع رمز الدولة)</label>
          <input id="contact_phone" type="tel" dir="ltr" style="text-align:left;" placeholder="+966501234567">
          <label>الوسيلة المفضلة للتواصل</label>
          <select id="preferred_contact">
            <option value="email">البريد الإلكتروني</option>
            <option value="whatsapp">واتساب</option>
          </select>
          <button class="btn gold" onclick="saveProfile()">حفظ التغييرات</button>
          <div id="msg"></div>
        </div>

        <h2 class="page-title" style="font-size:17px;margin-top:28px;">الدولة ونوع التأسيس</h2>
        <div class="card">
          <label>دولة التأسيس</label>
          <select id="country">
            <option value="SA">السعودية</option>
            <option value="AE">الإمارات</option>
            <option value="BH">البحرين</option>
            <option value="QA">قطر</option>
            <option value="EG">مصر</option>
          </select>
          <div id="pathWrap" style="display:none;">
            <label style="margin-top:14px;">نوع التأسيس</label>
            <select id="incorporation_path">
              <option value="foreign_investment">استثمار أجنبي</option>
              <option value="saudi_national">مواطن سعودي</option>
            </select>
          </div>
          <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">تغيير هذا الاختيار لا يؤثر على طلباتك الحالية، ويُستخدم فقط للطلبات الجديدة.</p>
          <button class="btn ghost" onclick="saveCountryPath()">حفظ</button>
          <div id="cpMsg"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);

  const { data: { user } } = await supabase.auth.getUser();
  document.getElementById('email').value = user.email;
  document.getElementById('full_name').value = profile.full_name || '';
  document.getElementById('contact_phone').value = profile.contact_phone || '';
  document.getElementById('preferred_contact').value = profile.preferred_contact || 'email';

  const { data: clientRow } = await supabase.from('clients').select('country, incorporation_path').eq('id', profile.id).maybeSingle();
  const country = clientRow?.country || 'SA';
  document.getElementById('country').value = country;
  document.getElementById('pathWrap').style.display = country === 'SA' ? 'block' : 'none';
  if(clientRow?.incorporation_path) document.getElementById('incorporation_path').value = clientRow.incorporation_path;
  document.getElementById('country').addEventListener('change', e => {
    document.getElementById('pathWrap').style.display = e.target.value === 'SA' ? 'block' : 'none';
  });
}

async function saveCountryPath(){
  const country = document.getElementById('country').value;
  const incorporation_path = country === 'SA' ? document.getElementById('incorporation_path').value : null;
  const cpMsg = document.getElementById('cpMsg');
  const { error } = await supabase.from('clients').update({ country, incorporation_path }).eq('id', profile.id);
  if(error){ cpMsg.className = 'msg err'; cpMsg.textContent = error.message; return; }
  cpMsg.className = 'msg ok';
  cpMsg.textContent = country === 'SA' ? 'تم الحفظ — يطبَّق على طلباتك الجديدة.' : 'تم الحفظ — سيتم تحويلك لصفحة الانتظار.';
  if(country !== 'SA'){ setTimeout(() => window.location.href = 'coming-soon.html', 900); }
}

async function saveProfile(){
  const full_name = document.getElementById('full_name').value.trim();
  const contact_phone = document.getElementById('contact_phone').value.trim().replace(/\s|-/g, '');
  const preferred_contact = document.getElementById('preferred_contact').value;
  const msg = document.getElementById('msg');

  const phoneRegex = /^\+[1-9]\d{7,14}$/;
  if(!phoneRegex.test(contact_phone)){
    msg.className = 'msg err';
    msg.textContent = 'رقم الجوال غير صحيح — لازم يبدأ برمز الدولة، مثال: 966501234567+';
    return;
  }

  const { error } = await supabase.from('profiles').update({ full_name, contact_phone, preferred_contact }).eq('id', profile.id);
  if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
  msg.className = 'msg ok'; msg.textContent = 'تم الحفظ بنجاح.';
}

init();
</script>
</body>
</html>
