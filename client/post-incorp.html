<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

const postIncorpNeeds = {
  'موارد بشرية': ['توظيف وتعيين', 'إدارة منصات حكومية (قوى، مقيم، مدد)', 'كتابة السياسات الداخلية', 'إدارة شؤون الموظفين اليومية'],
  'حسابات': ['مسك دفاتر وقيود محاسبية', 'إعداد القوائم المالية', 'الإقرارات الضريبية (VAT/الزكاة)', 'إعداد الرواتب (Payroll)'],
  'تسويق': ['إدارة حسابات التواصل الاجتماعي', 'حملات إعلانية مدفوعة', 'تحسين محركات البحث SEO', 'تصميم هوية بصرية ومحتوى'],
  'تشغيل': ['إعداد الإجراءات التشغيلية اليومية', 'إدارة سلسلة التوريد', 'إدارة خدمة العملاء', 'أتمتة العمليات'],
  'إدارة': ['بناء الهيكل التنظيمي', 'وضع الخطط الاستراتيجية', 'التقارير الإدارية الدورية', 'تدريب وتأهيل الكوادر الإدارية'],
  'إدارة مشاريع': ['تخطيط وجدولة المشاريع', 'متابعة التنفيذ والتقارير', 'إدارة الميزانيات', 'إدارة المخاطر'],
  'حوكمة': ['صياغة اللوائح الداخلية', 'الامتثال التنظيمي (Compliance)', 'إعداد سياسات مكافحة غسل الأموال', 'هيكلة مجلس الإدارة/اللجان'],
};
const postIncorpCategories = Object.keys(postIncorpNeeds);

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadPostIncorp();
}

async function loadPostIncorp(){
  const area = document.getElementById('postIncorpArea');
  const { data, error } = await supabase.from('post_incorp_requests').select('*').eq('client_id', profile.id).order('created_at', {ascending:false}).limit(1);

  if(error){ area.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }

  if(!data || !data.length){
    area.innerHTML = `
      <h3 class="mb-10">اختر ما تحتاجه</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">اختر الخدمات اللي تحتاجها، وحدّد المطلوب بالتفصيل، وفريق إتقان يجهّز لك عرض سعر مخصص.</p>
      <div id="piCategories">
        ${postIncorpCategories.map((c,i) => `
          <div class="service-card mb-10">
            <div class="service-head" style="cursor:default;">
              <div class="check-item" style="display:grid;grid-template-columns:1fr 26px;align-items:center;gap:10px;width:100%;">
                <label for="pi-${esc(i)}" style="margin:0;font-weight:700;font-size:14px;">${esc(c)}</label>
                <input type="checkbox" id="pi-${esc(i)}" value="${esc(c)}" style="margin:0;width:18px;height:18px;justify-self:start;" onchange="togglePiNeeds(${esc(i)})">
              </div>
            </div>
            <div id="piNeeds-${esc(i)}" style="display:none;padding:0 22px 16px;">
              ${postIncorpNeeds[c].map((n,j) => `
                <div class="check-item" style="display:grid;grid-template-columns:1fr 26px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);">
                  <label for="pi-${esc(i)}-${esc(j)}" style="margin:0;font-weight:400;font-size:13px;">${esc(n)}</label>
                  <input type="checkbox" id="pi-${esc(i)}-${esc(j)}" value="${esc(n)}" style="margin:0;width:16px;height:16px;justify-self:start;">
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <label>ملاحظات إضافية (اختياري)</label>
      <textarea id="piNotes" rows="2" placeholder="صف احتياجك بإيجاز"></textarea>
      <button class="btn gold" onclick="submitPostIncorp()">طلب عرض سعر</button>
      <div id="piMsg"></div>
    `;
    return;
  }

  const req = data[0];
  const statusLabels = { pending_review:'قيد المراجعة — بانتظار عرض من إتقان', quoted:'وصلك عرض سعر', accepted:'تم القبول ✓', rejected:'تم الرفض' };

  let html = `<h3 class="mb-10">طلبك الحالي</h3>`;
  html += `<p style="font-size:13.5px;margin-bottom:10px;">حالة الطلب: <strong>${esc(statusLabels[req.status])}</strong></p>`;
  const needsHtml = Object.entries(req.service_needs || {}).map(([cat, needs]) => `<strong>${esc(cat)}:</strong> ${esc(needs.join('، '))}`).join('<br>');
  html += `<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">${needsHtml}</p>`;

  if(req.status === 'quoted'){
    html += `
      <div class="card" style="background:var(--green-tint);">
        <p style="font-size:15px;font-weight:700;color:var(--green-dark);margin-bottom:8px;">${esc(req.quoted_price)} ر.س</p>
        <a href="../post-incorp-offer-view.html?id=${esc(req.id)}" class="btn ghost" style="padding:8px 16px;font-size:12.5px;margin-top:0;">عرض التفاصيل الكاملة</a><br>
        <button class="btn" style="margin-left:8px;" onclick="respondPostIncorp('${esc(req.id)}','accepted')">قبول العرض</button>
        <button class="btn ghost" onclick="respondPostIncorp('${esc(req.id)}','rejected')">رفض</button>
      </div>`;
  } else if(req.status === 'accepted'){
    html += `<a href="../post-incorp-offer-view.html?id=${esc(req.id)}" class="btn ghost btn-sm">عرض التفاصيل الكاملة</a>
      <a href="../post-incorp-contract-view.html?request_id=${esc(req.id)}" class="btn gold btn-sm">عرض الاتفاقية والتوقيع</a>
      <button onclick="goToSimamFromClient()" class="btn gold btn-sm">🎉 الانتقال إلى صمام من إتقان لمتابعة خدماتك ←</button>`;
  } else if(req.status === 'rejected'){
    html += `<button class="btn gold" onclick="resetPostIncorp()">طلب جديد</button>`;
  }

  area.innerHTML = html;
}

function togglePiNeeds(i){
  const el = document.getElementById(`piNeeds-${i}`);
  const checked = document.getElementById(`pi-${i}`).checked;
  el.style.display = checked ? 'block' : 'none';
}

async function submitPostIncorp(){
  const service_needs = {};
  postIncorpCategories.forEach((c,i) => {
    if(document.getElementById(`pi-${i}`).checked){
      const needs = postIncorpNeeds[c].filter((n,j) => document.getElementById(`pi-${i}-${j}`).checked);
      service_needs[c] = needs.length ? needs : ['(بدون تحديد فرعي)'];
    }
  });
  const notes = document.getElementById('piNotes').value.trim();
  const msg = document.getElementById('piMsg');
  if(!Object.keys(service_needs).length){ msg.className = 'msg err'; msg.textContent = 'اختر خدمة واحدة على الأقل'; return; }

  const { data: itqan } = await supabase.from('service_providers').select('id').eq('is_itqan', true).limit(1).single();

  const { error } = await supabase.from('post_incorp_requests').insert({
    client_id: profile.id,
    service_categories: Object.keys(service_needs),
    service_needs,
    client_notes: notes,
    assigned_provider_id: itqan ? itqan.id : null
  });
  if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }

  if(itqan) createNotification(itqan.id, 'طلب جديد لخدمات ما بعد التأسيس', profile.full_name, '../provider/dashboard.html');
  loadPostIncorp();
}

async function respondPostIncorp(id, decision){
  const { error } = await supabase.rpc('respond_post_incorp', { p_request: id, p_decision: decision });
  if(error){ alert(error.message); return; }
  loadPostIncorp();
}

async function goToSimamFromClient(){
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'جارٍ تجهيز الدخول...';
  try{
    const { data, error: fnErr } = await supabase.functions.invoke('simam-login-link', { body: {} });
    if(fnErr) throw fnErr;
    if(data.loginUrl){
      openSignedUrl(data.loginUrl);
    } else {
      alert('تعذر تجهيز الدخول التلقائي — تأكد إن شركتك اكتمل تأسيسها أولاً، أو جرّب تسجّل دخول يدوياً على simam.itqanbs.sa');
      window.open('https://simam.itqanbs.sa', '_blank', 'noopener,noreferrer');
    }
  } catch(e){
    window.open('https://simam.itqanbs.sa', '_blank', 'noopener,noreferrer');
  }
  btn.disabled = false; btn.textContent = '🎉 الانتقال إلى صمام من إتقان لمتابعة خدماتك ←';
}

init();
</script>
<script src="/assets/js/i18n-app.js"></script>
