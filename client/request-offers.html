<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>طلب عروض — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top"><div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div></header>
<main style="max-width:560px;">
  <h1 class="page-title" id="pageTitle">أخبرنا أكثر عن طلبك</h1>
  <p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;" id="pageSub">
    هذه الأسئلة تساعد فريق إتقان على تقديم عرض دقيق لحالتك — لا حاجة لرفع أي مستندات الآن.
  </p>
  <div class="card" id="formArea">
    <p style="text-align:center;color:var(--ink-soft);">جارٍ التحميل...</p>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile, isReady;
const editId = new URLSearchParams(window.location.search).get('edit_id');
let existingRequest = null;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;

  if(editId){
    const { data: req, error } = await supabase.from('service_requests').select('*').eq('id', editId).eq('client_id', profile.id).single();
    if(error || !req){ document.getElementById('formArea').innerHTML = '<p class="msg err">تعذر تحميل الطلب.</p>'; return; }

    const twoHoursMs = 2 * 60 * 60 * 1000;
    const expired = (Date.now() - new Date(req.created_at).getTime()) > twoHoursMs;
    if(req.status !== 'pending_admin_review' || expired){
      document.getElementById('formArea').innerHTML = '<p class="msg err">لم يعد بإمكانك تعديل هذا الطلب — تواصل مع فريق إتقان أو قدّم طلباً جديداً.</p>';
      return;
    }
    existingRequest = req;
    document.getElementById('pageTitle').textContent = 'تعديل طلبك';
    document.getElementById('pageSub').textContent = 'لديك حتى ساعتين من وقت التقديم لتعديل طلبك، طالما ما وصلك عرض بعد.';
  }

  const { data: client } = await supabase.from('clients').select('readiness_status').eq('id', profile.id).single();
  isReady = client?.readiness_status === 'ready';

  document.getElementById('formArea').innerHTML = isReady ? readyFormHtml() : notReadyFormHtml();
  if(existingRequest) prefillForm();
}

function prefillForm(){
  const r = existingRequest;
  const setVal = (id, val) => { const el = document.getElementById(id); if(el && val !== null && val !== undefined) el.value = val; };
  const setBool = (id, val) => { const el = document.getElementById(id); if(el && val !== null && val !== undefined) el.value = String(val); };

  if(isReady){
    setVal('activity_type', r.activity_type);
    setVal('last_audited_budget', r.last_audited_budget);
    setBool('docs_certified_home_country', r.docs_certified_home_country);
    setBool('docs_certified_embassy', r.docs_certified_embassy);
    setVal('residency_status', r.residency_status);
    setVal('acquisition_or_new', r.acquisition_or_new);
    setVal('gm_residency', r.gm_residency);
    setBool('gm_has_authority', r.gm_has_authority);
    setVal('notes', r.notes);
  } else {
    setVal('nr_activity_type', r.activity_type);
    setVal('nr_target_nationality', r.acquisition_target_nationality);
    setVal('nr_ownership_type', r.ownership_type);
    setVal('nr_residency_status', r.residency_status);
    setVal('nr_notes', r.notes);
  }
}

// ---------- استبيان العميل الجاهز (يملك شركة أجنبية جاهزة) ----------
function readyFormHtml(){
  return `
    <label>ما نوع النشاط المطلوب؟</label>
    <select id="activity_type">
      <option value="">اختر...</option>
      <option>خدمي</option>
      <option>صناعي</option>
      <option>زراعي</option>
      <option>تجاري</option>
    </select>

    <label>ما هي سنة آخر ميزانية مدققة للشركة؟</label>
    <select id="last_audited_budget">
      <option value="">اختر...</option>
      <option>2025</option>
      <option>2024</option>
      <option>2023</option>
      <option>2022 أو أقدم</option>
      <option>لا توجد ميزانية مدققة</option>
    </select>

    <label>هل تم تصديق الأوراق من الخارجية في البلد الأم؟</label>
    <select id="docs_certified_home_country">
      <option value="">اختر...</option>
      <option value="true">نعم</option>
      <option value="false">لا</option>
    </select>

    <label>هل تم تصديق المستندات من السفارة السعودية؟</label>
    <select id="docs_certified_embassy">
      <option value="">اختر...</option>
      <option value="true">نعم</option>
      <option value="false">لا</option>
    </select>

    <label>هل أنت زائر حالي بالمملكة، أم مقيم، أم خارج المملكة؟</label>
    <select id="residency_status">
      <option value="">اختر...</option>
      <option>زائر حالي بالمملكة</option>
      <option>مقيم بالمملكة</option>
      <option>خارج المملكة</option>
    </select>

    <label>هل ترغب بالاستحواذ على شركة سعودية قائمة أم إنشاء شركة جديدة؟</label>
    <select id="acquisition_or_new">
      <option value="">اختر...</option>
      <option>استحواذ على شركة قائمة</option>
      <option>إنشاء شركة جديدة</option>
    </select>

    <label>هل المدير العام المعيّن بالشركة مقيم داخل المملكة أم خارجها؟</label>
    <select id="gm_residency">
      <option value="">اختر...</option>
      <option>مقيم داخل المملكة</option>
      <option>مقيم خارج المملكة</option>
    </select>

    <label>هل يملك المدير العام بالشركة الأم صلاحيات تأسيس شركة بالخارج؟</label>
    <select id="gm_has_authority">
      <option value="">اختر...</option>
      <option value="true">نعم</option>
      <option value="false">لا</option>
    </select>

    <label>ملاحظات إضافية (اختياري)</label>
    <textarea id="notes" rows="3" placeholder="أي تفاصيل تحب تشاركها مع فريق إتقان"></textarea>

    <button class="btn gold" onclick="submitReady()">${existingRequest ? 'حفظ التعديلات' : 'إرسال الطلب'}</button>
    <div id="msg"></div>
  `;
}

function boolOrNull(val){
  if(val === 'true') return true;
  if(val === 'false') return false;
  return null;
}

async function submitReady(){
  const activity_type = document.getElementById('activity_type').value;
  const last_audited_budget = document.getElementById('last_audited_budget').value;
  const docs_certified_home_country = document.getElementById('docs_certified_home_country').value;
  const docs_certified_embassy = document.getElementById('docs_certified_embassy').value;
  const residency_status = document.getElementById('residency_status').value;
  const acquisition_or_new = document.getElementById('acquisition_or_new').value;
  const gm_residency = document.getElementById('gm_residency').value;
  const gm_has_authority = document.getElementById('gm_has_authority').value;
  const notes = document.getElementById('notes').value.trim();
  const msg = document.getElementById('msg');

  if(!activity_type || !residency_status || !acquisition_or_new){
    msg.className = 'msg err'; msg.textContent = 'الرجاء تعبئة الحقول الأساسية على الأقل'; return;
  }

  const payload = {
    activity_type, last_audited_budget,
    docs_certified_home_country: boolOrNull(docs_certified_home_country),
    docs_certified_embassy: boolOrNull(docs_certified_embassy),
    residency_status, acquisition_or_new, gm_residency,
    gm_has_authority: boolOrNull(gm_has_authority),
    notes
  };

  if(existingRequest){
    const { error } = await supabase.from('service_requests').update(payload).eq('id', existingRequest.id);
    if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
    await notifyAdmins('العميل عدّل طلب عروضه', profile.full_name, '../admin/requests.html');
  } else {
    const { error } = await supabase.from('service_requests').insert({ client_id: profile.id, status: 'pending_admin_review', ...payload });
    if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
    await notifyAdmins('طلب عروض جديد', profile.full_name + ' أرسل طلب عروض جديد', '../admin/requests.html');
  }
  window.location.href = 'requests.html';
}

// ---------- استبيان العميل غير الجاهز (سنوفر له شركة عبر الاستحواذ) ----------
function notReadyFormHtml(){
  return `
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">بما إن ملفك لسا غير جاهز، هذي الأسئلة تساعدنا نوجّهك لعرض متخصص بالاستحواذ على شركة مناسبة لك.</p>

    <label>ما نوع النشاط المطلوب؟</label>
    <select id="nr_activity_type">
      <option value="">اختر...</option>
      <option>خدمي</option>
      <option>صناعي</option>
      <option>زراعي</option>
      <option>تجاري</option>
    </select>

    <label>ما جنسية المنشأة المطلوب الاستحواذ عليها؟</label>
    <input id="nr_target_nationality" placeholder="مثال: الإمارات، مصر، بريطانيا...">

    <label>هل ترغب أن يكون لديك شركاء أم ملكية كاملة 100%؟</label>
    <select id="nr_ownership_type">
      <option value="">اختر...</option>
      <option>ملكية كاملة 100%</option>
      <option>وجود شركاء</option>
    </select>

    <label>هل أنت مقيم بالمملكة أم خارجها؟</label>
    <select id="nr_residency_status">
      <option value="">اختر...</option>
      <option>زائر حالي بالمملكة</option>
      <option>مقيم بالمملكة</option>
      <option>خارج المملكة</option>
    </select>

    <label>ملاحظات إضافية (اختياري)</label>
    <textarea id="nr_notes" rows="3" placeholder="أي تفاصيل تحب تشاركها مع فريق إتقان"></textarea>

    <button class="btn gold" onclick="submitNotReady()">${existingRequest ? 'حفظ التعديلات' : 'إرسال الطلب'}</button>
    <div id="msg"></div>
  `;
}

async function submitNotReady(){
  const activity_type = document.getElementById('nr_activity_type').value;
  const acquisition_target_nationality = document.getElementById('nr_target_nationality').value.trim();
  const ownership_type = document.getElementById('nr_ownership_type').value;
  const residency_status = document.getElementById('nr_residency_status').value;
  const notes = document.getElementById('nr_notes').value.trim();
  const msg = document.getElementById('msg');

  if(!activity_type || !acquisition_target_nationality || !ownership_type || !residency_status){
    msg.className = 'msg err'; msg.textContent = 'الرجاء تعبئة كل الحقول'; return;
  }

  const payload = { activity_type, acquisition_target_nationality, ownership_type, residency_status, acquisition_or_new: 'استحواذ على شركة قائمة', notes };

  if(existingRequest){
    const { error } = await supabase.from('service_requests').update(payload).eq('id', existingRequest.id);
    if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
    await notifyAdmins('العميل عدّل طلب عروضه', profile.full_name, '../admin/requests.html');
  } else {
    const { error } = await supabase.from('service_requests').insert({ client_id: profile.id, status: 'pending_admin_review', ...payload });
    if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
    await notifyAdmins('طلب عروض جديد', profile.full_name + ' أرسل طلب عروض جديد', '../admin/requests.html');
  }
  window.location.href = 'requests.html';
}

init();
</script>
</body>
</html>
