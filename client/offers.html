<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>العروض — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .chat-box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:var(--paper);}
  .chat-msgs{max-height:200px;overflow-y:auto;margin-bottom:10px;}
  .chat-msg{font-size:13px;padding:7px 12px;border-radius:10px;margin-bottom:6px;max-width:80%;}
  .chat-msg.mine{background:var(--green-tint);margin-right:auto;text-align:left;}
  .chat-msg.theirs{background:var(--white);border:1px solid var(--line);}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;margin:0;padding:9px;}

  .sig-modal-overlay{display:none;position:fixed;inset:0;background:rgba(29,38,33,.55);z-index:200;align-items:center;justify-content:center;padding:20px;}
  .sig-modal{background:var(--white);border-radius:var(--radius-lg);padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);}
  .sig-modal h3{font-family:'Amiri',serif;color:var(--green-dark);margin-bottom:6px;}
  .sig-modal p.hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  #sigCanvas{width:100%;height:160px;border:1.5px dashed var(--line);border-radius:12px;background:var(--paper);touch-action:none;cursor:crosshair;}
  .sig-actions{display:flex;gap:10px;margin-top:14px;}
  .sig-actions .btn{margin:0;flex:1;}
</style>
</head>
<body>
<div class="sig-modal-overlay" id="sigModal">
  <div class="sig-modal">
    <h3>توقيع اعتماد العرض</h3>
    <p class="hint">بتوقيعك هنا، أنت توافق رسمياً على شروط هذا العرض.</p>
    <label>الاسم الكامل</label>
    <input id="sigNameInput" placeholder="اسمك الكامل">
    <label>التوقيع (ارسم بإصبعك أو الماوس)</label>
    <canvas id="sigCanvas"></canvas>
    <div class="sig-actions">
      <button class="btn ghost" onclick="clearSignature()">مسح التوقيع</button>
      <button class="btn gold" onclick="confirmAcceptWithSignature()">تأكيد القبول والتوقيع</button>
    </div>
    <div id="sigMsg"></div>
    <button class="btn ghost" style="width:100%;margin-top:10px;" onclick="closeSignatureModal()">إلغاء</button>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">🧭</span> بوصلة الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub active"><span class="ic">💰</span> العروض</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="messages.html" class="side-link"><span class="ic">💬</span> الرسائل</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">العروض الواردة</h1>
        <div class="card" id="offersArea"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile, activeRequest;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadOffers();
}

async function loadOffers(){
  const area = document.getElementById('offersArea');
  const requestIdParam = new URLSearchParams(window.location.search).get('request_id');

  let query = supabase.from('service_requests').select('*').eq('client_id', profile.id);
  query = requestIdParam ? query.eq('id', requestIdParam) : query.order('created_at', {ascending:false}).limit(1);
  const { data: requests } = await query;

  if(!requests || !requests.length){
    area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">ما عندك طلب تأسيس، فما فيه عروض بعد. <a href="requests.html">اطلب عروض من هنا</a></p>';
    return;
  }
  activeRequest = requests[0];

  const { data: offers, error } = await supabase
    .from('offers')
    .select('id, price, duration_days, status, service_providers(company_name, rating)')
    .eq('request_id', activeRequest.id)
    .order('price');

  if(error){ area.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!offers || !offers.length){ area.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">لا توجد عروض بعد — سيتواصل معك مقدمو الخدمة قريباً.</p>'; return; }

  let html = `<table><thead><tr><th>مقدّم الخدمة</th><th>السعر</th><th>مدة التنفيذ</th><th>إجراء</th></tr></thead><tbody>`;
  offers.forEach(o => {
    const isAccepted = o.status === 'accepted';
    html += `<tr>
      <td>${o.service_providers?.company_name || '—'}</td>
      <td>${o.price} ر.س</td>
      <td>${o.duration_days} يوم</td>
      <td>
        ${isAccepted ? '<span class="badge ready">تم القبول ✓</span> <a href="../contract-view.html?offer_id=' + o.id + '" class="btn gold" style="padding:6px 12px;font-size:12px;margin-top:0;">عرض العقد والتوقيع</a>' : (activeRequest.status === 'open' ? `<button class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="acceptOffer('${o.id}','${activeRequest.id}')">قبول العرض</button>` : '—')}
        <a href="../offer-view.html?id=${o.id}" class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;">عرض التفاصيل</a>
        <button class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="toggleChat('${o.id}')">محادثة</button>
        ${isAccepted ? `<button class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="togglePayments('${o.id}')">الدفعات</button>` : ''}
      </td>
    </tr>
    <tr id="chat-row-${o.id}" style="display:none;"><td colspan="4"><div id="chat-${o.id}"></div></td></tr>
    ${isAccepted ? `<tr id="payments-row-${o.id}" style="display:none;"><td colspan="4"><div id="payments-${o.id}"></div></td></tr>` : ''}`;
  });
  html += `</tbody></table>`;
  area.innerHTML = html;
}

function toggleChat(offerId){
  const row = document.getElementById(`chat-row-${offerId}`);
  const isHidden = row.style.display === 'none';
  row.style.display = isHidden ? 'table-row' : 'none';
  if(isHidden) renderChat(offerId);
}

async function renderChat(offerId){
  const el = document.getElementById(`chat-${offerId}`);
  el.innerHTML = `<div class="chat-box"><div class="chat-msgs" id="msgs-${offerId}">جارٍ التحميل...</div>
    <div class="chat-input-row"><input id="input-${offerId}" placeholder="اكتب رسالة..."><button class="btn" style="margin:0;padding:8px 16px;" onclick="sendMessage('${offerId}')">إرسال</button></div></div>`;
  loadMessages(offerId);
}

async function loadMessages(offerId){
  const { data, error } = await supabase.from('messages').select('*').eq('offer_id', offerId).order('created_at');
  const box = document.getElementById(`msgs-${offerId}`);
  if(error){ box.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ box.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">لا توجد رسائل بعد.</p>'; return; }
  box.innerHTML = data.map(m => `<div class="chat-msg ${m.sender_id === profile.id ? 'mine' : 'theirs'}">${m.message}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(offerId){
  const input = document.getElementById(`input-${offerId}`);
  const text = input.value.trim();
  if(!text) return;
  const { error } = await supabase.from('messages').insert({ offer_id: offerId, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadMessages(offerId);

  const { data: offerRow } = await supabase.from('offers').select('provider_id').eq('id', offerId).single();
  if(offerRow) createNotification(offerRow.provider_id, 'رسالة جديدة من العميل', text.slice(0,60), '../provider/dashboard.html');
}

function togglePayments(offerId){
  const row = document.getElementById(`payments-row-${offerId}`);
  const isHidden = row.style.display === 'none';
  row.style.display = isHidden ? 'table-row' : 'none';
  if(isHidden) loadPayments(offerId);
}

async function loadPayments(offerId){
  const el = document.getElementById(`payments-${offerId}`);
  const { data, error } = await supabase.from('offer_payments').select('*').eq('offer_id', offerId).order('created_at');

  if(error){ el.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ el.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">لا توجد دفعات مسجّلة بعد من مقدّم الخدمة.</p>'; return; }

  el.innerHTML = data.map(p => {
    let statusText, statusColor;
    if(p.client_confirmed && p.provider_confirmed){ statusText = '✅ مؤكد من الطرفين'; statusColor = 'var(--green)'; }
    else if(p.client_confirmed){ statusText = 'بانتظار تأكيد مقدّم الخدمة'; statusColor = 'var(--gold-deep)'; }
    else { statusText = 'بانتظار تأكيدك للسداد'; statusColor = 'var(--ink-soft)'; }

    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
      <div><strong style="font-size:13px;">${p.label}</strong> — <span style="font-size:12.5px;">${p.amount} ر.س</span><br><span style="font-size:11.5px;color:${statusColor};">${statusText}</span></div>
      ${!p.client_confirmed ? `<button class="btn" style="padding:6px 12px;font-size:11px;margin-top:0;" onclick="confirmPaymentClient('${p.id}','${offerId}')">أكّد أنني سدّدت</button>` : ''}
    </div>`;
  }).join('');
}

async function confirmPaymentClient(paymentId, offerId){
  const { error } = await supabase.from('offer_payments').update({ client_confirmed: true, client_confirmed_at: new Date().toISOString() }).eq('id', paymentId);
  if(error){ alert(error.message); return; }
  loadPayments(offerId);

  const { data: offerRow } = await supabase.from('offers').select('provider_id').eq('id', offerId).single();
  if(offerRow) createNotification(offerRow.provider_id, 'العميل أكّد السداد', 'يرجى تأكيد استلام الدفعة من لوحتك', '../provider/dashboard.html');
}

async function acceptOffer(offerId, requestId){
  window.pendingAcceptOfferId = offerId;
  window.pendingAcceptRequestId = requestId;
  openSignatureModal();
}

function openSignatureModal(){
  document.getElementById('sigModal').style.display = 'flex';
  document.getElementById('sigNameInput').value = profile.full_name || '';
  setTimeout(initSignaturePad, 50);
}

function closeSignatureModal(){
  document.getElementById('sigModal').style.display = 'none';
}

let sigCtx, sigDrawing = false, sigHasDrawn = false;
function initSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  canvas.width = canvas.offsetWidth;
  canvas.height = 160;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#1D2621';
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigHasDrawn = false;

  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };
  const start = (e) => { sigDrawing = true; sigHasDrawn = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = (e) => { if(!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = () => { sigDrawing = false; };

  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

function clearSignature(){
  const canvas = document.getElementById('sigCanvas');
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasDrawn = false;
}

async function confirmAcceptWithSignature(){
  const msg = document.getElementById('sigMsg');
  const name = document.getElementById('sigNameInput').value.trim();
  if(!name){ msg.className = 'msg err'; msg.textContent = 'اكتب اسمك الكامل'; return; }
  if(!sigHasDrawn){ msg.className = 'msg err'; msg.textContent = 'وقّع بخط يدك بالمساحة أعلاه'; return; }

  const offerId = window.pendingAcceptOfferId;
  const requestId = window.pendingAcceptRequestId;

  const canvas = document.getElementById('sigCanvas');
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  const filePath = `${profile.id}/client_signature_${offerId}_${Date.now()}.png`;
  const { error: upErr } = await supabase.storage.from('offer-attachments').upload(filePath, blob);
  if(upErr){ msg.className = 'msg err'; msg.textContent = upErr.message; return; }

  const { error: offErr } = await supabase.from('offers').update({
    status: 'accepted', client_approved_at: new Date().toISOString(),
    client_signature_name: name, client_signature_path: filePath, client_signed_at: new Date().toISOString()
  }).eq('id', offerId);
  if(offErr){ msg.className = 'msg err'; msg.textContent = offErr.message; return; }

  const { error: reqErr } = await supabase.from('service_requests').update({ status: 'offer_selected' }).eq('id', requestId);
  if(reqErr){ msg.className = 'msg err'; msg.textContent = reqErr.message; return; }

  await createStagesIfNeeded(requestId);

  await supabase.from('contracts').insert({ request_id: requestId, offer_id: offerId, client_id: profile.id });

  closeSignatureModal();
  loadOffers();

  const { data: offerRow } = await supabase.from('offers').select('provider_id').eq('id', offerId).single();
  if(offerRow) createNotification(offerRow.provider_id, 'تم قبول عرضك ✓', 'العميل قبل عرضك ووقّعه، تابع مراحل التنفيذ من لوحتك', '../provider/dashboard.html');
}

async function createStagesIfNeeded(requestId){
  const { data: existing } = await supabase.from('request_stages').select('id').eq('request_id', requestId).limit(1);
  if(existing && existing.length) return;
  const stageNames = [
    'بدء إجراءات الاستحواذ', 'بدء إجراءات نقل الملكية للشركة الخارجية', 'تصديق المستندات', 'شحن المستندات',
    'التقديم على رخصة الاستثمار', 'حجز الاسم التجاري', 'التقديم على عقد التأسيس والسجل التجاري', 'صدور عقد التأسيس والسجل التجاري'
  ];
  const rows = stageNames.map((name,i)=>({ request_id: requestId, stage_order: i+1, stage_name: name }));
  await supabase.from('request_stages').insert(rows);
}

init();
</script>
</body>
</html>
