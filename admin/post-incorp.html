<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>خدمات ما بعد التأسيس — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="clients.html" class="side-link"><span class="ic">👥</span> العملاء وتصنيفاتها</a>
      <a href="requests.html" class="side-link"><span class="ic">🏢</span> طلبات العروض</a>
      <a href="post-incorp.html" class="side-link active"><span class="ic">🗂️</span> خدمات ما بعد التأسيس</a>
      <a href="company-settings.html" class="side-link"><span class="ic">🏛️</span> بيانات الشركة</a>
      <a href="team.html" class="side-link"><span class="ic">🧑‍💼</span> الفريق</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">خدمات ما بعد التأسيس</h1>
        <div class="card">
          <div id="postIncorpBody"><p style="font-size:13.5px;color:var(--ink-soft);">جارٍ التحميل...</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
async function init(){
  const profile = await requireRole(['admin']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadPostIncorpAdmin();
}

async function loadPostIncorpAdmin(){
  const body = document.getElementById('postIncorpBody');
  const { data, error } = await supabase
    .from('post_incorp_requests')
    .select('id, service_needs, service_categories, client_notes, status, quoted_price, client_id, clients(profiles(full_name))')
    .order('created_at', {ascending:false});

  if(error){ body.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ body.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">لا توجد طلبات خدمات ما بعد التأسيس بعد.</p>'; return; }

  const statusLabels = { pending_review:'قيد المراجعة من إتقان', quoted:'تم إرسال عرض', accepted:'مقبول ✓', rejected:'مرفوض' };

  body.innerHTML = data.map(r => {
    const needsHtml = Object.entries(r.service_needs || {}).map(([cat, needs]) => `<strong>${cat}:</strong> ${needs.join('، ')}`).join('<br>');
    const actionHtml = r.status === 'pending_review'
      ? `<a href="submit-postincorp-offer.html?id=${r.id}" class="btn gold" style="padding:8px 18px;font-size:13px;">تجهيز عرض تفصيلي</a>`
      : `<p style="font-size:13px;font-weight:700;color:var(--green-dark);">${r.quoted_price || ''} ر.س</p>
           <a href="../post-incorp-offer-view.html?id=${r.id}" class="btn ghost" style="padding:7px 14px;font-size:12.5px;margin-top:0;">عرض التفاصيل</a>
           ${r.status === 'accepted' ? `<a href="../post-incorp-contract-view.html?request_id=${r.id}" class="btn gold" style="padding:7px 14px;font-size:12.5px;margin-top:0;">الاتفاقية والتوقيع</a>` : ''}`;
    return `
    <div class="list-item-card">
      <p style="font-size:14px;margin-bottom:4px;"><strong>${r.clients?.profiles?.full_name || r.client_id}</strong> — ${statusLabels[r.status]}</p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;">${needsHtml || (r.service_categories||[]).join('، ')}</p>
      ${r.client_notes ? `<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">ملاحظات العميل: ${r.client_notes}</p>` : ''}
      ${actionHtml}
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
