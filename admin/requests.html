<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>طلبات العروض — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="clients.html" class="side-link"><span class="ic">👥</span> العملاء وتصنيفاتها</a>
      <a href="requests.html" class="side-link active"><span class="ic">🏢</span> طلبات العروض</a>
      <a href="post-incorp.html" class="side-link"><span class="ic">🗂️</span> خدمات ما بعد التأسيس</a>
      <a href="company-settings.html" class="side-link"><span class="ic">🏛️</span> بيانات الشركة</a>
      <a href="team.html" class="side-link"><span class="ic">🧑‍💼</span> الفريق</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">طلبات العروض</h1>
        <div class="card">
          <table>
            <thead><tr><th>العميل</th><th>النشاط</th><th>العروض</th><th>حالة الطلب</th><th>إجراء</th></tr></thead>
            <tbody id="allRequestsBody"><tr><td colspan="5">جارٍ التحميل...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
async function init(){
  const profile = await requireRole(['admin']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadAllRequests();
}

async function loadAllRequests(){
  const body = document.getElementById('allRequestsBody');
  const { data: requests, error } = await supabase
    .from('service_requests')
    .select('id, status, activity_type, created_at, client_id, incorporation_completed_at, clients(profiles(full_name))')
    .order('created_at', {ascending:false});

  if(error){ body.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`; return; }
  if(!requests || !requests.length){ body.innerHTML = '<tr><td colspan="5">لا توجد طلبات بعد</td></tr>'; return; }

  const { data: offers } = await supabase.from('offers').select('id, request_id, status');
  const { data: allContracts } = await supabase.from('contracts').select('offer_id, itqan_signed_at');
  const contractSignedMap = {};
  (allContracts || []).forEach(c => { if(c.itqan_signed_at) contractSignedMap[c.offer_id] = true; });
  const { data: allStages } = await supabase.from('request_stages').select('request_id, started_at, completed_at, status');

  const offerCountMap = {};
  const acceptedSet = new Set();
  const acceptedOfferIdMap = {};
  (offers || []).forEach(o => {
    offerCountMap[o.request_id] = (offerCountMap[o.request_id] || 0) + 1;
    if(o.status === 'accepted'){ acceptedSet.add(o.request_id); acceptedOfferIdMap[o.request_id] = o.id; }
  });

  const lastActivityMap = {};
  (allStages || []).forEach(s => {
    const t = s.completed_at || s.started_at;
    if(t && (!lastActivityMap[s.request_id] || new Date(t) > new Date(lastActivityMap[s.request_id]))){
      lastActivityMap[s.request_id] = t;
    }
  });

  const STALL_DAYS = 14;
  const now = new Date();

  body.innerHTML = requests.map(r => {
    const offerCount = offerCountMap[r.id] || 0;
    const isCompleted = r.status === 'completed';
    let statusLabel;
    if(isCompleted) statusLabel = '<span class="badge ready">مكتمل ✓</span>';
    else if(acceptedSet.has(r.id)) statusLabel = '<span class="badge pending">قيد التنفيذ</span>';
    else if(offerCount > 0) statusLabel = '<span class="badge pending">بانتظار موافقة العميل</span>';
    else statusLabel = '<span class="badge notready">بانتظار عرض من إتقان</span>';

    let stallBadge = '';
    if(!isCompleted && acceptedSet.has(r.id)){
      const lastActivity = lastActivityMap[r.id];
      const refDate = lastActivity ? new Date(lastActivity) : new Date(r.created_at);
      const daysSince = Math.floor((now - refDate) / (1000*60*60*24));
      if(daysSince >= STALL_DAYS){
        stallBadge = ` <span class="badge notready" title="لا تحديث منذ ${daysSince} يوم">⚠ متأخر (${daysSince} يوم)</span>`;
      }
    }

    let actionCell = '—';
    if(isCompleted){
      actionCell = `<a href="journey-tracker.html?request_id=${r.id}" class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;">تم التأسيس ✓ — مراجعة المراحل</a>`;
    } else if(offerCount === 0){
      actionCell = `<a href="submit-offer.html?request_id=${r.id}" class="btn gold" style="padding:6px 12px;font-size:12px;margin-top:0;">تقديم عرض</a>`;
    } else if(offerCount > 0 && !acceptedSet.has(r.id)){
      actionCell = `<a href="submit-offer.html?request_id=${r.id}" class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;">تعديل العرض</a>`;
    } else if(acceptedSet.has(r.id)){
      const offerId = acceptedOfferIdMap[r.id];
      if(contractSignedMap[offerId] && !r.incorporation_completed_at){
        actionCell = `<a href="journey-tracker.html?request_id=${r.id}" class="btn gold" style="padding:6px 12px;font-size:12px;margin-top:0;">متابعة المراحل</a>`;
      } else if(!contractSignedMap[offerId]){
        actionCell = `<a href="../contract-view.html?offer_id=${offerId}" class="btn gold" style="padding:6px 12px;font-size:12px;margin-top:0;">العقد والتوقيع</a>`;
      }
    }

    return `<tr>
      <td>${r.clients?.profiles?.full_name || r.client_id}</td>
      <td>${r.activity_type || '—'}</td>
      <td>${offerCount} عرض</td>
      <td>${statusLabel}${stallBadge}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
