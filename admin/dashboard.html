<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>لوحة الإدارة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:var(--paper);}
  .welcome-banner{background:linear-gradient(135deg, var(--green-dark), var(--green)); border-radius:var(--radius-lg); padding:30px 34px; color:var(--white); margin-bottom:28px; position:relative; overflow:hidden;}
  .welcome-banner::before{content:'';position:absolute;top:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);}
  .welcome-banner h1{font-family:'Amiri',serif; font-size:24px; margin-bottom:6px; position:relative;}
  .welcome-banner p{color:rgba(255,255,255,.82); font-size:13.5px; position:relative;}
  .stats-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  @media(max-width:720px){.stats-row{grid-template-columns:1fr 1fr;}}
  .stat-box{background:var(--white); border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px; text-align:center; box-shadow:var(--shadow-sm); transition:.3s var(--ease);}
  .stat-box:hover{box-shadow:var(--shadow); transform:translateY(-2px);}
  .stat-box .n{font-family:'Amiri',serif; font-size:26px; font-weight:700; color:var(--green-dark);}
  .stat-box .l{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link active"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="clients.html" class="side-link"><span class="ic">👥</span> العملاء وتصنيفاتها</a>
      <a href="requests.html" class="side-link"><span class="ic">🏢</span> طلبات العروض</a>
      <a href="post-incorp.html" class="side-link"><span class="ic">🗂️</span> خدمات ما بعد التأسيس</a>
      <a href="company-settings.html" class="side-link"><span class="ic">🏛️</span> بيانات الشركة</a>
      <a href="team.html" class="side-link"><span class="ic">🧑‍💼</span> الفريق</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <div class="welcome-banner">
          <h1>مركز التحقق والإدارة 👋</h1>
          <p>نظرة سريعة على حالة المنصة الآن</p>
        </div>

        <div class="stats-row">
          <div class="stat-box"><div class="n" id="statClients">0</div><div class="l">إجمالي العملاء</div></div>
          <div class="stat-box"><div class="n" id="statPending">0</div><div class="l">طلبات بانتظار التوجيه</div></div>
          <div class="stat-box"><div class="n" id="statActiveRequests">0</div><div class="l">طلبات قيد التنفيذ</div></div>
          <div class="stat-box"><div class="n" id="statPostIncorp">0</div><div class="l">طلبات ما بعد التأسيس بانتظار عرض</div></div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:12px;">⚠ طلبات متأخرة تحتاج متابعة</h3>
          <div id="stalledArea"><p style="font-size:13px;color:var(--ink-soft);">جارٍ التحميل...</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['admin']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadStats();
}

async function loadStats(){
  const { count: clientsCount } = await supabase.from('clients').select('id', {count:'exact', head:true});
  document.getElementById('statClients').textContent = clientsCount || 0;

  const { count: pendingCount } = await supabase.from('service_requests').select('id', {count:'exact', head:true}).eq('status', 'pending_admin_review');
  document.getElementById('statPending').textContent = pendingCount || 0;

  const { data: offers } = await supabase.from('offers').select('request_id, status').eq('status', 'accepted');
  const { data: allRequests } = await supabase.from('service_requests').select('id, status');
  const acceptedReqIds = new Set((offers||[]).map(o => o.request_id));
  const activeCount = (allRequests||[]).filter(r => acceptedReqIds.has(r.id) && r.status !== 'completed').length;
  document.getElementById('statActiveRequests').textContent = activeCount;

  const { count: piCount } = await supabase.from('post_incorp_requests').select('id', {count:'exact', head:true}).eq('status', 'pending_review');
  document.getElementById('statPostIncorp').textContent = piCount || 0;

  loadStalled(allRequests || [], offers || []);
}

async function loadStalled(requests, acceptedOffers){
  const area = document.getElementById('stalledArea');
  const { data: allStages } = await supabase.from('request_stages').select('request_id, started_at, completed_at, status');
  const { data: clientsData } = await supabase.from('clients').select('id, profiles(full_name)');
  const nameMap = {}; (clientsData||[]).forEach(c => nameMap[c.id] = c.profiles?.full_name);

  const acceptedReqIds = new Set(acceptedOffers.map(o => o.request_id));
  const lastActivityMap = {};
  (allStages||[]).forEach(s => {
    const t = s.completed_at || s.started_at;
    if(t && (!lastActivityMap[s.request_id] || new Date(t) > new Date(lastActivityMap[s.request_id]))) lastActivityMap[s.request_id] = t;
  });

  const STALL_DAYS = 14;
  const now = new Date();
  const stalled = requests.filter(r => acceptedReqIds.has(r.id) && r.status !== 'completed').map(r => {
    const lastActivity = lastActivityMap[r.id];
    const refDate = lastActivity ? new Date(lastActivity) : null;
    if(!refDate) return null;
    const days = Math.floor((now - refDate) / (1000*60*60*24));
    return days >= STALL_DAYS ? { clientId: r.id, requestId: r.id, days } : null;
  }).filter(Boolean);

  if(!stalled.length){ area.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">لا توجد طلبات متأخرة حالياً. 👍</p>'; return; }

  area.innerHTML = stalled.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);">
      <span style="font-size:13px;">${nameMap[s.clientId] || s.clientId}</span>
      <span class="badge notready">⚠ ${s.days} يوم بدون تحديث</span>
    </div>
  `).join('');
}

init();
</script>
</body>
</html>
