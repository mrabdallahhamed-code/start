<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>بيانات الشركة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="clients.html" class="side-link"><span class="ic">👥</span> العملاء وتصنيفاتها</a>
      <a href="requests.html" class="side-link"><span class="ic">🏢</span> طلبات العروض</a>
      <a href="post-incorp.html" class="side-link"><span class="ic">🗂️</span> خدمات ما بعد التأسيس</a>
      <a href="company-settings.html" class="side-link active"><span class="ic">🏛️</span> بيانات الشركة</a>
      <a href="team.html" class="side-link"><span class="ic">🧑‍💼</span> الفريق</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar"><div id="notifBellContainer"></div></header>
    <main class="app-main">
      <div class="app-main-inner" style="max-width:520px;">
        <h1 class="page-title">بيانات إتقان الرسمية</h1>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:-14px;margin-bottom:20px;">هذي البيانات تظهر تلقائياً بكل العروض والعقود اللي تصدرها المنصة.</p>

        <div class="card">
          <label>اسم الشركة (عربي)</label>
          <input id="company_name_ar">
          <label>اسم الشركة (إنجليزي)</label>
          <input id="company_name_en">
          <label>رقم السجل التجاري</label>
          <input id="cr_number" placeholder="مثال: 1010xxxxxx">
          <label>تاريخ التأسيس</label>
          <input id="established_date" type="date">
          <label>العنوان</label>
          <input id="address">
          <label>رقم الهاتف</label>
          <input id="phone">
          <label>البريد الإلكتروني</label>
          <input id="email">
          <button class="btn gold" onclick="saveSettings()">حفظ البيانات</button>
          <div id="msg"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
async function init(){
  const profile = await requireRole(['admin']);
  if(!profile) return;
  initNotificationBell(profile.id);

  const { data, error } = await supabase.from('company_settings').select('*').eq('id', 1).single();
  if(error || !data) return;

  document.getElementById('company_name_ar').value = data.company_name_ar || '';
  document.getElementById('company_name_en').value = data.company_name_en || '';
  document.getElementById('cr_number').value = data.cr_number || '';
  document.getElementById('established_date').value = data.established_date || '';
  document.getElementById('address').value = data.address || '';
  document.getElementById('phone').value = data.phone || '';
  document.getElementById('email').value = data.email || '';
}

async function saveSettings(){
  const msg = document.getElementById('msg');
  const payload = {
    company_name_ar: document.getElementById('company_name_ar').value.trim(),
    company_name_en: document.getElementById('company_name_en').value.trim(),
    cr_number: document.getElementById('cr_number').value.trim(),
    established_date: document.getElementById('established_date').value || null,
    address: document.getElementById('address').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    updated_at: new Date().toISOString()
  };
  const { error } = await supabase.from('company_settings').update(payload).eq('id', 1);
  if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }
  msg.className = 'msg ok'; msg.textContent = 'تم الحفظ بنجاح.';
}

init();
</script>
</body>
</html>
