<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة مراحل التنفيذ — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .stage-card{border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; background:var(--white);}
  .stage-card.completed{background:var(--green-tint); border-color:var(--green-tint2);}
  .stage-card.waiting{background:#FFF8EC; border-color:#E8C77A;}
  .stage-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .stage-head strong{font-size:14.5px;}
  .stage-status{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .stage-status.pending{background:var(--line-soft); color:var(--ink-soft);}
  .stage-status.in_progress{background:var(--gold-soft); color:var(--gold-deep);}
  .stage-status.waiting_client{background:#F5D98A; color:#7A5A0A;}
  .stage-status.completed{background:var(--green-tint2); color:var(--green-dark);}
  .stage-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .doc-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line-soft);}
  .note-box{background:var(--white); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:12.5px;}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="clients.html" class="side-link"><span class="ic">👥</span> العملاء وتصنيفاتها</a>
      <a href="requests.html" class="side-link active"><span class="ic">🏢</span> طلبات العروض</a>
      <a href="post-incorp.html" class="side-link"><span class="ic">🗂️</span> خدمات ما بعد التأسيس</a>
      <a href="company-settings.html" class="side-link"><span class="ic">🏛️</span> بيانات الشركة</a>
      <a href="team.html" class="side-link"><span class="ic">🧑‍💼</span> الفريق</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar"><div id="notifBellContainer"></div></header>
    <main class="app-main">
      <div class="app-main-inner" style="max-width:620px;">
        <a href="requests.html" style="font-size:13px;color:var(--ink-soft);text-decoration:none;">← رجوع لطلبات العروض</a>
        <h1 class="page-title" style="margin-top:10px;">متابعة مراحل التنفيذ</h1>
        <p id="clientNameLine" style="font-size:13px;color:var(--ink-soft);margin-top:-14px;margin-bottom:20px;"></p>

        <div id="stagesContainer"><p style="font-size:13px;color:var(--ink-soft);">جارٍ التحميل...</p></div>

        <div id="finalizeBox" style="display:none;" class="card">
          <p style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">✅ كل المراحل اكتملت — الخطوة الأخيرة: سجّل بيانات الشركة النهائية.</p>
          <a id="finalizeLink" href="#" class="btn gold" style="width:100%;">تسجيل التأسيس النهائي ←</a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;
const requestId = new URLSearchParams(window.location.search).get('request_id');
const statusLabels = { pending: 'لم تبدأ', in_progress: 'جاري العمل', waiting_client: 'بانتظار رد العميل', completed: 'مكتملة ✓' };

async function init(){
  try{
    profile = await requireRole(['admin']);
    if(!profile) return;
    initNotificationBell(profile.id);
    if(!requestId){ document.body.innerHTML = '<p style="padding:40px;text-align:center;">لم يتم تحديد الطلب.</p>'; return; }

    const { data: req, error: reqErr } = await supabase.from('service_requests').select('client_id, clients(profiles(full_name))').eq('id', requestId).single();
    if(reqErr) throw new Error('فشل جلب بيانات الطلب: ' + reqErr.message);
    if(req) document.getElementById('clientNameLine').textContent = 'العميل: ' + (req.clients?.profiles?.full_name || '—');
    document.getElementById('finalizeLink').href = 'finalize-incorporation.html?request_id=' + requestId;

    await loadStages();
  } catch(err){
    document.getElementById('stagesContainer').innerHTML = `<div style="background:#FCECEA;border:2px solid #B5442E;border-radius:10px;padding:16px;color:#7A3325;font-size:13px;"><strong>⚠ خطأ فعلي:</strong><br>${err.message || err}</div>`;
    console.error(err);
  }
}

async function loadStages(){
  try{
    const { data: stages, error } = await supabase.from('request_stages').select('*').eq('request_id', requestId).order('stage_order');
    const container = document.getElementById('stagesContainer');
    if(error) throw new Error('فشل جلب المراحل: ' + error.message);
    if(!stages || !stages.length){ container.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">لم تُنشأ مراحل التنفيذ بعد.</p>'; return; }

  let html = '';
  for(const s of stages){
    const cls = s.status === 'completed' ? 'completed' : (s.status === 'waiting_client' ? 'waiting' : '');
    const { data: docs } = await supabase.from('stage_documents').select('*').eq('stage_id', s.id).order('uploaded_at', {ascending:false});
    const { data: procs } = await supabase.from('stage_procedures').select('*').eq('stage_id', s.id).order('procedure_order');

    const doneCount = (procs || []).filter(p => p.is_done).length;
    const totalCount = (procs || []).length;
    const procsHtml = (procs || []).map(p => `
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer;">
        <input type="checkbox" ${p.is_done ? 'checked' : ''} onchange="toggleProcedure('${p.id}', this.checked, '${s.id}')" style="margin:0;width:16px;height:16px;">
        <span style="${p.is_done ? 'text-decoration:line-through;color:var(--ink-soft);' : ''}">${p.procedure_name}</span>
      </label>`).join('');

    let actions = '';
    if(s.status === 'pending'){
      actions = `<button class="btn ghost" style="padding:6px 14px;font-size:11.5px;margin-top:0;" onclick="updateStage('${s.id}','in_progress')">بدء المرحلة</button>`;
    } else if(s.status === 'in_progress' || s.status === 'waiting_client'){
      actions = `
        <button class="btn gold" style="padding:6px 14px;font-size:11.5px;margin-top:0;" onclick="updateStage('${s.id}','completed')">إنهاء المرحلة</button>
        <button class="btn ghost" style="padding:6px 14px;font-size:11.5px;margin-top:0;" onclick="promptWaiting('${s.id}')">طلب رد العميل</button>
        <label class="btn ghost" style="padding:6px 14px;font-size:11.5px;margin-top:0;cursor:pointer;">رفع ملف
          <input type="file" style="display:none;" onchange="uploadDoc('${s.id}', this)">
        </label>`;
    }

    html += `<div class="stage-card ${cls}">
      <div class="stage-head">
        <strong>${s.stage_order}. ${s.stage_name}</strong>
        <span class="stage-status ${s.status}">${statusLabels[s.status] || s.status}</span>
      </div>
      ${totalCount ? `<p style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">الإجراءات: ${doneCount}/${totalCount}</p><div style="background:var(--paper);border-radius:8px;padding:8px 12px;margin-bottom:8px;">${procsHtml}</div>` : ''}
      ${s.admin_note ? `<div class="note-box">📝 ${s.admin_note}</div>` : ''}
      ${s.client_reply_text ? `<div class="note-box" style="border-color:var(--green-tint2);background:var(--green-tint);"><strong>💬 ردّ العميل:</strong><br>${s.client_reply_text}${s.client_replied_at ? `<br><span style="font-size:10.5px;color:var(--ink-soft);">${new Date(s.client_replied_at).toLocaleString('ar-SA')}</span>` : ''}</div>` : ''}
      ${docs && docs.length ? docs.map(d => `<div class="doc-row"><span>📎 ${d.file_name || 'ملف'}</span><a href="#" onclick="downloadDoc('${d.file_path}');return false;" style="color:var(--green-dark);">تحميل</a></div>`).join('') : ''}
      <div class="stage-actions">${actions}</div>
    </div>`;
  }
  container.innerHTML = html;

  const allDone = stages.every(s => s.status === 'completed');
  document.getElementById('finalizeBox').style.display = allDone ? 'block' : 'none';
  } catch(err){
    document.getElementById('stagesContainer').innerHTML = `<div style="background:#FCECEA;border:2px solid #B5442E;border-radius:10px;padding:16px;color:#7A3325;font-size:13px;"><strong>⚠ خطأ فعلي:</strong><br>${err.message || err}</div>`;
    console.error(err);
  }
}

async function toggleProcedure(procId, isDone, stageId){
  await supabase.from('stage_procedures').update({ is_done: isDone, completed_at: isDone ? new Date().toISOString() : null }).eq('id', procId);
  loadStages();
}

async function updateStage(stageId, newStatus){
  const payload = { status: newStatus, waiting_on_client: false };
  if(newStatus === 'in_progress') payload.started_at = new Date().toISOString();
  if(newStatus === 'completed') payload.completed_at = new Date().toISOString();
  const { error } = await supabase.from('request_stages').update(payload).eq('id', stageId);
  if(error){ alert(error.message); return; }
  loadStages();
}

async function promptWaiting(stageId){
  const note = prompt('اكتب الملاحظة أو الطلب اللي تبي توصله للعميل:');
  if(!note) return;
  const { error } = await supabase.from('request_stages').update({ status: 'waiting_client', waiting_on_client: true, admin_note: note }).eq('id', stageId);
  if(error){ alert(error.message); return; }

  const { data: stageRow } = await supabase.from('request_stages').select('request_id').eq('id', stageId).single();
  const { data: reqRow } = await supabase.from('service_requests').select('client_id').eq('id', stageRow.request_id).single();
  if(reqRow) createNotification(reqRow.client_id, 'إتقان محتاجة ردّك', note.slice(0,60), '../client/journey.html?request_id=' + stageRow.request_id);

  loadStages();
}

async function uploadDoc(stageId, input){
  if(!input.files.length) return;
  const file = input.files[0];
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const filePath = `${profile.id}/stage_${stageId}_${Date.now()}_${safeName}`;
  const { error: upErr } = await supabase.storage.from('offer-attachments').upload(filePath, file);
  if(upErr){ alert(upErr.message); return; }
  await supabase.from('stage_documents').insert({ stage_id: stageId, file_path: filePath, file_name: file.name, uploaded_by_role: 'admin' });
  loadStages();
}

async function downloadDoc(filePath){
  const { data } = await supabase.storage.from('offer-attachments').createSignedUrl(filePath, 3600);
  if(data?.signedUrl) window.open(data.signedUrl, '_blank');
}

init();
</script>
</body>
</html>
