<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصادقة الثنائية — مبتدأ من إتقان</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/png" href="/assets/icons/favicon-48.png">
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="/assets/js/security.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="/assets/js/auth-common.js"></script>
<style>.qr{display:block;margin:12px auto;width:200px;height:200px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px;} .secret{direction:ltr;text-align:center;font-family:monospace;letter-spacing:2px;word-break:break-all;background:var(--paper);padding:8px;border-radius:8px;font-size:13px;}</style>
<script src="/assets/js/analytics.js" defer></script>
</head>
<body>
<header class="top"><div class="brand"><span class="brand-name">مبتدأ <small>من إتقان</small></span></div></header>
<main class="mw-480">
  <h1 class="page-title txt-center">المصادقة الثنائية</h1>
  <div class="card is-hidden" id="enrollCard">
    <p style="font-size:13.5px;line-height:1.9;margin-bottom:8px;">حسابك أدمن، ولذلك يلزم تفعيل المصادقة الثنائية. افتح تطبيق مصادقة (Google Authenticator أو Microsoft Authenticator أو Authy) وامسح الرمز:</p>
    <img id="qr" class="qr" alt="رمز QR للمصادقة الثنائية">
    <p style="font-size:12px;color:var(--ink-soft);text-align:center;">أو أدخل المفتاح يدوياً:</p>
    <div class="secret" id="secret"></div>
    <label for="code1" class="mt-14">الرمز المكوّن من 6 أرقام</label>
    <input id="code1" inputmode="numeric" maxlength="6" autocomplete="one-time-code" dir="ltr" style="text-align:center;letter-spacing:6px;">
    <button class="btn" id="enrollBtn">تفعيل</button>
  </div>
  <div class="card is-hidden" id="verifyCard">
    <p style="font-size:13.5px;line-height:1.9;margin-bottom:8px;">أدخل الرمز الحالي من تطبيق المصادقة:</p>
    <input id="code2" inputmode="numeric" maxlength="6" autocomplete="one-time-code" dir="ltr" style="text-align:center;letter-spacing:6px;">
    <button class="btn" id="verifyBtn">تأكيد</button>
  </div>
  <div id="msg" role="alert"></div>
  <p style="text-align:center;font-size:13px;margin-top:14px;"><a href="#" id="logout">تسجيل الخروج</a></p>
</main>
<script>
const params = new URLSearchParams(location.search);
const NEXT = (() => { const n = safeInternalPath(params.get('next') || ''); return n && n.startsWith('/admin/') ? n : '/admin/dashboard.html'; })();
let factorId = null;
document.getElementById('logout').addEventListener('click', e => { e.preventDefault(); signOut(); });

async function init(){
  const profile = await getCurrentProfile();
  if(!profile){ location.replace('/auth/login.html'); return; }
  if(profile.role !== 'admin'){ location.replace(homeForRole(profile.role)); return; }
  if(await adminMfaOk()){ location.replace(NEXT); return; }
  const { data: fl } = await supabase.auth.mfa.listFactors();
  const totp = (fl && fl.totp || []).find(f => f.status === 'verified');
  if(totp){ factorId = totp.id; document.getElementById('verifyCard').style.display = 'block'; return; }
  // تنظيف محاولات تسجيل قديمة غير مكتملة
  for(const f of (fl && fl.all || [])){ if(f.status !== 'verified'){ try{ await supabase.auth.mfa.unenroll({ factorId: f.id }); }catch(e){} } }
  const { data, error } = await supabase.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Mubtada Admin ' + Date.now() });
  if(error){ showMsg('msg','err','تعذّر بدء التفعيل: ' + error.message); return; }
  factorId = data.id;
  document.getElementById('qr').src = data.totp.qr_code;
  document.getElementById('secret').textContent = data.totp.secret;
  document.getElementById('enrollCard').style.display = 'block';
}
async function verify(codeId){
  const code = document.getElementById(codeId).value.trim();
  if(!/^\d{6}$/.test(code)){ showMsg('msg','err','أدخل 6 أرقام'); return; }
  const { error } = await supabase.auth.mfa.challengeAndVerify({ factorId, code });
  if(error){ showMsg('msg','err','الرمز غير صحيح، حاول مجدداً'); return; }
  location.replace(NEXT);
}
document.getElementById('enrollBtn').addEventListener('click', () => verify('code1'));
document.getElementById('verifyBtn').addEventListener('click', () => verify('code2'));
init();
</script>
<script src="/assets/js/i18n-app.js"></script>
</body>
</html>
