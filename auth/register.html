<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>إنشاء حساب — إتقان</title>
<link rel="canonical" href="https://start.itqanbs.sa/auth/register.html">
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #langToggleBtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:11px;font-weight:800;cursor:pointer;color:var(--green-dark);letter-spacing:.5px;}
  #langToggleBtn:hover{border-color:var(--gold);color:var(--gold-deep);}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/mubtada-logo.png" alt="مبتدأ"></div>
  <button id="langToggleBtn" onclick="toggleLang()">EN</button>
</header>
<main style="max-width:480px;">
  <h1 class="page-title" data-i18n="register_title">إنشاء حساب جديد</h1>
  <div class="card">
    <label data-i18n="register_fullname">الاسم الكامل</label>
    <input id="full_name" type="text" placeholder="اسمك الثلاثي">
    <label data-i18n="register_email">البريد الإلكتروني</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label>رقم الجوال (بالصيغة الدولية)</label>
    <input id="contact_phone" type="tel" dir="ltr" style="text-align:left;" placeholder="+966501234567">
    <label data-i18n="register_password">كلمة المرور</label>
    <div style="position:relative;">
      <input id="password" type="password" placeholder="8 أحرف على الأقل" style="padding-left:40px;">
      <button type="button" onclick="togglePasswordVisibility('password', this)" aria-label="إظهار كلمة المرور" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;">👁️</button>
    </div>
    <label style="display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:12.5px;font-weight:normal;line-height:1.6;">
      <input type="checkbox" id="termsAgree" style="width:auto;margin:3px 0 0;flex-shrink:0;">
      <span data-i18n="register_terms_text">بإنشاء الحساب، أنت توافق على <a href="https://www.itqanbs.sa/terms/" target="_blank" data-i18n="register_terms_link">الشروط والأحكام</a> و<a href="https://www.itqanbs.sa/privacy/" target="_blank" data-i18n="register_privacy_link">سياسة الخصوصية</a></span>
    </label>
    <button class="btn" onclick="register()" data-i18n="register_btn">إنشاء الحساب</button>
    <div id="msg"></div>
    <p style="margin-top:16px;font-size:13px;"><span data-i18n="register_have_account">لديك حساب؟</span> <a href="login.html" data-i18n="register_login_link">تسجيل الدخول</a></p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/i18n.js"></script>
<script>
async function register(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const full_name = document.getElementById('full_name').value.trim();
  const contact_phone = document.getElementById('contact_phone').value.trim().replace(/\s|-/g, '');
  const preferred_language = getLang();
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';

  if(!document.getElementById('termsAgree').checked){
    msg.className='msg err'; msg.textContent='لازم توافق على الشروط والأحكام وسياسة الخصوصية أول';
    return;
  }

  if(!email || !password || !full_name || !contact_phone){
    msg.className='msg err'; msg.textContent='الرجاء تعبئة كل الحقول'; return;
  }

  const phoneRegex = /^\+[1-9]\d{7,14}$/;
  if(!phoneRegex.test(contact_phone)){
    msg.className='msg err';
    msg.textContent='رقم الجوال غير صحيح — لازم يبدأ برمز الدولة، مثال: 966501234567+';
    return;
  }

  const { data, error } = await supabase.auth.signUp({ email, password });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  const userId = data.user.id;
  const { error: profErr } = await supabase.from('profiles').insert({ id: userId, full_name, role: 'client', preferred_language, email, contact_phone });
  if(profErr){ msg.className='msg err'; msg.textContent = profErr.message; return; }

  await supabase.from('clients').insert({ id: userId });

  msg.className='msg ok';
  msg.textContent='تم إنشاء الحساب! تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول.';
}
</script>
</body>
</html>
