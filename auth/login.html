<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — مبتدأ من إتقان</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="icon" type="image/png" href="/assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="/assets/js/security.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="/assets/js/auth-common.js"></script>
<style>
  #langToggleBtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:11px;font-weight:800;cursor:pointer;color:var(--green-dark);letter-spacing:.5px;}
  .auth-logo{display:block;margin:0 auto 18px;width:150px;height:auto;}
  .auth-note{font-size:12.5px;color:var(--ink-soft);margin-top:14px;text-align:center;}
</style>
<script src="/assets/js/analytics.js" defer></script>
</head>
<body>
<header class="top"><div class="brand"><span class="brand-name">مبتدأ <small>من إتقان</small></span></div><button id="langToggleBtn" onclick="toggleLang()">EN</button></header>
<main class="mw-480">
  <img class="auth-logo" src="../assets/images/mubtada-logo.png" alt="مبتدأ من إتقان — منصة الاستثمار من إتقان" width="150" height="174">
  <h1 class="page-title txt-center" data-i18n="login_title">تسجيل الدخول</h1>
  <div class="card" id="loginCard">
    <form id="loginForm" autocomplete="on" novalidate>
      <label for="email" data-i18n="login_email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required>
      <label for="password" data-i18n="login_password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer;"><input id="remember" type="checkbox" style="width:auto;"><span data-i18n="login_remember">تذكّرني على هذا الجهاز</span></label>
      <div id="captchaBox" class="mt-12"></div>
      <button class="btn" type="submit" id="loginBtn" data-i18n="login_btn">دخول</button>
      <div id="msg" role="alert"></div>
    </form>
    <p style="margin-top:10px;font-size:13px;"><a href="#" id="forgotLink" data-i18n="login_forgot_link">نسيت كلمة المرور؟</a></p>
    <p style="margin-top:6px;font-size:13px;"><span data-i18n="login_no_account">ليس لديك حساب؟</span> <a href="register.html" data-i18n="login_register_link">إنشاء حساب جديد</a></p>
  </div>
  <div class="card is-hidden" id="forgotCard">
    <h3 data-i18n="forgot_title" class="mb-10">استعادة كلمة المرور</h3>
    <p data-i18n="forgot_sub" class="hint mb-12">اكتب بريدك الإلكتروني وسنرسل لك رابط تعيين كلمة مرور جديدة.</p>
    <label for="forgotEmail" data-i18n="login_email">البريد الإلكتروني</label>
    <input id="forgotEmail" type="email" autocomplete="email" maxlength="254">
    <div id="captchaBoxForgot" class="mt-12"></div>
    <button class="btn" type="button" id="forgotBtn" data-i18n="forgot_send_btn">إرسال رابط الاستعادة</button>
    <div id="forgotMsg" role="alert"></div>
    <p style="margin-top:10px;font-size:13px;"><a href="#" id="forgotBack" data-i18n="forgot_back">← رجوع لتسجيل الدخول</a></p>
  </div>
  <p class="auth-note"><a href="/privacy.html" data-i18n="link_privacy">سياسة الخصوصية</a> · <a href="/terms.html" data-i18n="link_terms">شروط الاستخدام</a> · <a href="https://invest.itqanbs.sa" rel="noopener" data-i18n="link_about">تعرّف على الخدمة</a></p>
</main>
<script>
const params = new URLSearchParams(location.search);
if(params.get('e') === 'disabled') showMsg('msg','err', L('هذا النوع من الحسابات غير مفعّل حالياً.','This account type is not enabled.'));
initCaptcha('captchaBox');
// تعبئة البريد المحفوظ (بريد فقط، لا كلمة مرور)
try{ const e = localStorage.getItem('mub_email'); if(e){ document.getElementById('email').value = e; document.getElementById('remember').checked = true; } }catch(x){}

async function afterLogin(){
  const profile = await getCurrentProfile();
  if(!profile){ showMsg('msg','err', L('تعذر تحميل بيانات الحساب. حاول مرة أخرى.','Could not load your account. Please try again.')); await supabase.auth.signOut(); return; }
  if(profile.role === 'provider'){ await supabase.auth.signOut(); showMsg('msg','err', L('هذا النوع من الحسابات غير مفعّل حالياً.','This account type is not enabled.')); return; }
  const next = safeInternalPath(params.get('next') || '');
  if(profile.role === 'admin'){
    if(!(await adminMfaOk())){ window.location.replace('/auth/mfa.html?next=' + encodeURIComponent(next || '/admin/dashboard.html')); return; }
    window.location.replace(next && next.startsWith('/admin/') ? next : '/admin/dashboard.html'); return;
  }
  window.location.replace(next && next.startsWith('/client/') ? next : '/client/dashboard.html');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const st = lockState();
  if(st.locked){ showMsg('msg','err', L('محاولات كثيرة. انتظر ' + st.seconds + ' ثانية.','Too many attempts. Wait ' + st.seconds + ' seconds.')); return; }
  if(!email || !password){ showMsg('msg','err', L('أدخل البريد وكلمة المرور.','Enter your email and password.')); return; }
  if(captchaRequired() && !window.__captchaToken){ showMsg('msg','err', L('أكمل التحقق الأمني.','Complete the security check.')); return; }
  const remember = document.getElementById('remember').checked;
  setRememberMe(remember);
  try{ if(remember) localStorage.setItem('mub_email', email); else localStorage.removeItem('mub_email'); }catch(x){}
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  const opts = captchaRequired() ? { captchaToken: window.__captchaToken } : undefined;
  const { error } = await supabase.auth.signInWithPassword({ email, password, options: opts });
  btn.disabled = false;
  if(error){
    registerFailure();
    if(window.turnstile){ try{ window.turnstile.reset(); window.__captchaToken = null; }catch(x){} }
    // رسالة موحّدة: لا نكشف هل البريد مسجّل أم لا
    showMsg('msg','err', L('بيانات الدخول غير صحيحة أو الحساب غير مؤكَّد.','Incorrect credentials, or the account is not confirmed.'));
    return;
  }
  clearFailures();
  await afterLogin();
});

// تحقق أمني مستقل لنموذج «نسيت كلمة المرور» (رمز Turnstile يُستخدم مرة واحدة فقط)
window.__forgotCaptchaToken = null; let __forgotWidget = null;
function renderForgotCaptcha(){
  if(!captchaRequired() || __forgotWidget !== null) return;
  const tryRender = () => {
    if(!window.turnstile) return setTimeout(tryRender, 300);
    __forgotWidget = window.turnstile.render('#captchaBoxForgot', { sitekey: window.APP_CONFIG.turnstileSiteKey, callback: t => { window.__forgotCaptchaToken = t; } });
  };
  tryRender();
}
document.getElementById('forgotLink').addEventListener('click', e => { e.preventDefault(); document.getElementById('loginCard').style.display='none'; document.getElementById('forgotCard').style.display='block'; renderForgotCaptcha(); });
document.getElementById('forgotBack').addEventListener('click', e => { e.preventDefault(); document.getElementById('forgotCard').style.display='none'; document.getElementById('loginCard').style.display='block'; });
document.getElementById('forgotBtn').addEventListener('click', async () => {
  const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  if(!email){ showMsg('forgotMsg','err', L('أدخل بريدك الإلكتروني','Enter your email')); return; }
  if(captchaRequired() && !window.__forgotCaptchaToken){ showMsg('forgotMsg','err', L('أكمل التحقق الأمني.','Complete the security check.')); return; }
  const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/auth/reset-password.html', captchaToken: window.__forgotCaptchaToken || undefined });
  if(window.turnstile && __forgotWidget !== null){ try{ window.turnstile.reset(__forgotWidget); window.__forgotCaptchaToken = null; }catch(x){} }
  if(error && /captcha/i.test(error.message || '')){ showMsg('forgotMsg','err', L('فشل التحقق الأمني، حاول مرة أخرى.','Security check failed, please try again.')); return; }
  showMsg('forgotMsg','ok', L('إن كان البريد مسجّلاً لدينا فقد وصلك رابط تعيين كلمة مرور جديدة (تحقق من مجلد الرسائل غير المرغوبة أيضاً).','If the email is registered, a reset link has been sent (check spam too).'));
});

// إن كان مسجّلاً أصلاً
(async () => { const { data: { session } } = await supabase.auth.getSession(); if(session) afterLogin(); })();
</script>
</body>
</html>
