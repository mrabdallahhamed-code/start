<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>تسجيل الدخول — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #langToggleBtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:11px;font-weight:800;cursor:pointer;color:var(--green-dark);letter-spacing:.5px;}
  #langToggleBtn:hover{border-color:var(--gold);color:var(--gold-deep);}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
  <button id="langToggleBtn" onclick="toggleLang()">EN</button>
</header>
<main style="max-width:480px;">
  <h1 class="page-title" data-i18n="login_title">تسجيل الدخول</h1>
  <div class="card">
    <label data-i18n="login_email">البريد الإلكتروني</label>
    <input id="email" type="email">
    <label data-i18n="login_password">كلمة المرور</label>
    <input id="password" type="password">
    <button class="btn" onclick="login()" data-i18n="login_btn">دخول</button>
    <div id="msg"></div>
    <p style="margin-top:16px;font-size:13px;"><span data-i18n="login_no_account">ليس لديك حساب؟</span> <a href="register.html" data-i18n="login_register_link">إنشاء حساب جديد</a></p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/i18n.js?v=8"></script>
<script>
async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  const profile = await getCurrentProfile();
  if(!profile){ msg.className='msg err'; msg.textContent='تعذر جلب بيانات الحساب'; return; }

  if(profile.role === 'admin') window.location.href = '../admin/dashboard.html';
  else if(profile.role === 'provider') window.location.href = '../provider/dashboard.html';
  else window.location.href = '../client/dashboard.html';
}
</script>
</body>
</html>
