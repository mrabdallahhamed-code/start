<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إتقان">

<title>تعيين كلمة مرور جديدة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
</header>
<main style="max-width:480px;">
  <h1 class="page-title">تعيين كلمة مرور جديدة</h1>
  <div class="card" id="formCard">
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">اكتب كلمة المرور الجديدة اللي تبي تستخدمها من الآن.</p>
    <label>كلمة المرور الجديدة</label>
    <input id="newPassword" type="password" placeholder="6 أحرف على الأقل">
    <label>تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password">
    <button class="btn" onclick="updatePassword()">حفظ كلمة المرور الجديدة</button>
    <div id="msg"></div>
  </div>
  <div class="card" id="invalidCard" style="display:none;">
    <p style="font-size:13px;color:var(--ink-soft);">الرابط غير صالح أو منتهي الصلاحية. <a href="login.html">ارجع لتسجيل الدخول</a> وجرّب "نسيت كلمة المرور" من جديد.</p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script>
// Supabase يضيف رمز الاستعادة بالرابط تلقائياً (Hash) ويكوّن جلسة استعادة مؤقتة
supabase.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('formCard').style.display = 'block';
  }
});

// لو دخل الصفحة مباشرة بدون رابط صالح (بعد فترة قصيرة وما صار PASSWORD_RECOVERY)
setTimeout(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('invalidCard').style.display = 'block';
  }
}, 2500);

async function updatePassword(){
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('msg');

  if(p1.length < 6){ msg.className='msg err'; msg.textContent='كلمة المرور لازم تكون 6 أحرف على الأقل'; return; }
  if(p1 !== p2){ msg.className='msg err'; msg.textContent='كلمتا المرور غير متطابقتين'; return; }

  const { error } = await supabase.auth.updateUser({ password: p1 });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  msg.className='msg ok';
  msg.textContent='تم تغيير كلمة المرور بنجاح! جارٍ تحويلك لتسجيل الدخول...';
  setTimeout(() => { window.location.href = 'login.html'; }, 2000);
}
</script>
</body>
</html>
