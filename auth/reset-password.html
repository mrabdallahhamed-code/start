<title>تعيين كلمة مرور جديدة — إتقان</title>

<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
</header>
<main class="mw-480">
  <h1 class="page-title">تعيين كلمة مرور جديدة</h1>
  <div class="card" id="formCard">
    <p class="hint mb-12">اكتب كلمة المرور الجديدة اللي تبي تستخدمها من الآن.</p>
    <label>كلمة المرور الجديدة</label>
    <input id="newPassword" type="password" placeholder="10 أحرف على الأقل">
    <label>تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password">
    <button class="btn" onclick="updatePassword()">حفظ كلمة المرور الجديدة</button>
    <div id="msg"></div>
  </div>
  <div class="card is-hidden" id="invalidCard">
    <p class="txt-soft">الرابط غير صالح أو منتهي الصلاحية. <a href="login.html">ارجع لتسجيل الدخول</a> وجرّب "نسيت كلمة المرور" من جديد.</p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script src="/assets/js/auth-common.js"></script>
<script>
// Supabase يضيف رمز الاستعادة بالرابط تلقائياً (Hash) ويكوّن جلسة استعادة مؤقتة
supabase.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('formCard').style.display = 'block';
  }
});

// لو دخل الصفحة مباشرة بدون رابط صالح (بعد فترة قصيرة وما صار PASSWORD_RECOVERY)
setTimeout(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('invalidCard').style.display = 'block';
  }
}, 2500);

async function updatePassword(){
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('msg');

  const _pp = passwordProblems(p1); if(_pp.length){ msg.className='msg err'; msg.textContent='كلمة المرور ضعيفة: ' + _pp.join('، '); return; }
  if(p1 !== p2){ msg.className='msg err'; msg.textContent='كلمتا المرور غير متطابقتين'; return; }

  const { error } = await supabase.auth.updateUser({ password: p1 });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  msg.className='msg ok';
  msg.textContent='تم تغيير كلمة المرور بنجاح! جارٍ تحويلك لتسجيل الدخول...';
  setTimeout(() => { window.location.href = 'login.html'; }, 2000);
}
</script>
<script src="/assets/js/i18n-app.js"></script>
</body>
</html>
