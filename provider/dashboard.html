<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E7D5B">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مبتدأ من إتقان">

<title>لوحة مقدّم الخدمة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="/assets/js/security.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .chat-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;background:var(--cream);}
  .chat-msgs{max-height:200px;overflow-y:auto;margin-bottom:10px;}
  .chat-msg{font-size:13px;padding:6px 10px;border-radius:8px;margin-bottom:6px;max-width:80%;}
  .chat-msg.mine{background:var(--green-tint);margin-right:auto;text-align:left;}
  .chat-msg.theirs{background:var(--white);border:1px solid var(--line);}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;margin:0;padding:8px;}
</style>
<script src="/assets/js/analytics.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/mubtada-mark.png" alt="مبتدأ من إتقان" width="34" height="36" class="brand-mark"><span class="brand-name">مبتدأ <small>من إتقان</small></span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="notifBellContainer"></div>
    <button class="btn ghost" onclick="signOut()">تسجيل الخروج</button>
  </div>
</header>
<main>
  <h1 class="page-title">لوحة مقدّم الخدمة</h1>

  <div class="tabs">
    <button class="active" onclick="switchTab('requests')">الطلبات المتاحة</button>
    <button onclick="switchTab('offers')">العروض المُقدَّمة والمحادثات</button>
    <button onclick="switchTab('postIncorp')">خدمات ما بعد التأسيس</button>
    <button onclick="switchTab('docs')">مستنداتي</button>
    <button onclick="switchTab('messages')">رسائل من إتقان</button>
  </div>

  <div id="tab-requests">
    <div class="card">
      <table>
        <thead><tr><th>رقم الطلب</th><th>نوع النشاط</th><th>سنة آخر ميزانية</th><th>إجراء</th></tr></thead>
        <tbody id="reqBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-offers" class="is-hidden">
    <div id="offersArea"><p class="txt-soft-lg">جارٍ التحميل...</p></div>
  </div>

  <div id="tab-postIncorp" class="is-hidden">
    <div id="postIncorpArea"><p class="txt-soft-lg">جارٍ التحميل...</p></div>
  </div>

  <div id="tab-docs" class="is-hidden">
    <div class="card">
      <h3 class="mb-10">رفع مستند</h3>
      <label>نوع المستند</label>
      <select id="doc_type">
        <option>عقد التأسيس</option>
        <option>السجل التجاري</option>
        <option>الشهادة الضريبية</option>
        <option>العنوان الوطني</option>
      </select>
      <label>الملف</label>
      <input id="doc_file" type="file">
      <button class="btn gold" onclick="uploadProviderDoc()">رفع المستند</button>
      <div id="uploadMsg"></div>
    </div>
    <div class="card">
      <h3 class="mb-10">مستنداتي المرفوعة</h3>
      <table>
        <thead><tr><th>النوع</th><th>تاريخ الرفع</th><th>الحالة</th></tr></thead>
        <tbody id="docsBody"><tr><td colspan="3">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-messages" class="is-hidden">
    <div class="card">
      <h3 class="mb-10">رسائل من فريق إتقان</h3>
      <div id="adminMsgsList"><p class="txt-soft">جارٍ التحميل...</p></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input id="adminMsgInput" placeholder="اكتب ردّك هنا...">
        <button class="btn btn-pad m-0" onclick="sendAdminMsg()">إرسال</button>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

function switchTab(tab){
  document.getElementById('tab-requests').style.display = tab==='requests' ? 'block':'none';
  document.getElementById('tab-offers').style.display = tab==='offers' ? 'block':'none';
  document.getElementById('tab-postIncorp').style.display = tab==='postIncorp' ? 'block':'none';
  document.getElementById('tab-docs').style.display = tab==='docs' ? 'block':'none';
  document.getElementById('tab-messages').style.display = tab==='messages' ? 'block':'none';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(tab==='offers') loadOffers();
  if(tab==='postIncorp') loadProviderPostIncorp();
  if(tab==='docs') loadProviderDocs();
  if(tab==='messages') loadAdminMsgs();
}

async function loadProviderPostIncorp(){
  const area = document.getElementById('postIncorpArea');
  const { data, error } = await supabase
    .from('post_incorp_requests')
    .select('id, service_needs, service_categories, client_notes, status, quoted_price')
    .eq('assigned_provider_id', profile.id)
    .order('created_at', {ascending:false});

  if(error){ area.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  if(!data || !data.length){ area.innerHTML = '<p class="txt-soft-lg">لا توجد طلبات موجّهة لك حالياً.</p>'; return; }

  const statusLabels = { pending_review:'بانتظار عرضك', quoted:'تم إرسال عرض', accepted:'مقبول ✓', rejected:'مرفوض' };

  area.innerHTML = data.map(r => {
    const needsHtml = Object.entries(r.service_needs || {}).map(([cat, needs]) => `<strong>${esc(cat)}:</strong> ${esc(needs.join('، '))}`).join('<br>');
    return `
    <div class="card">
      <p style="font-size:14px;font-weight:700;margin-bottom:4px;">طلب #${esc(r.id.slice(0,8))} — ${esc(statusLabels[r.status])}</p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">${needsHtml || esc((r.service_categories||[]).join('، '))}</p>
      ${r.client_notes ? `<p style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">ملاحظات العميل: ${esc(r.client_notes)}</p>` : ''}
      ${r.status === 'pending_review'
        ? `<a href="submit-postincorp-offer.html?id=${esc(r.id)}" class="btn gold" style="padding:8px 18px;font-size:13px;">تجهيز عرض تفصيلي</a>`
        : `<p style="font-size:13px;font-weight:700;color:var(--green-dark);">${esc(r.quoted_price || '')} ر.س</p>
           <a href="../post-incorp-offer-view.html?id=${esc(r.id)}" class="btn ghost btn-sm-flush">عرض التفاصيل</a>`
      }
    </div>`;
  }).join('');
}

async function loadAdminMsgs(){
  const { data, error } = await supabase.from('admin_messages').select('*').eq('recipient_id', profile.id).order('created_at');
  const list = document.getElementById('adminMsgsList');
  if(error){ list.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  if(!data || !data.length){ list.innerHTML = '<p class="txt-soft">لا توجد رسائل حتى الآن.</p>'; return; }
  list.innerHTML = data.map(m => `<div class="chat-msg ${m.sender_id===profile.id?'mine':'theirs'}">${esc(m.message)}</div>`).join('');
}

async function sendAdminMsg(){
  const input = document.getElementById('adminMsgInput');
  const text = input.value.trim();
  if(!text) return;
  const { data: admins } = await supabase.from('profiles').select('id').eq('role','admin').limit(1);
  if(!admins || !admins.length){ alert('تعذر تحديد جهة الإدارة'); return; }
  const { error } = await supabase.from('admin_messages').insert({ recipient_id: admins[0].id, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadAdminMsgs();
  createNotification(admins[0].id, 'رسالة جديدة من مقدّم الخدمة: ' + (profile.full_name || 'مقدّم خدمة'), text.slice(0,60), '../admin/dashboard.html');
}

async function init(){
  profile = await requireRole(['provider']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadRequests();
}

async function loadRequests(){
  const { data, error } = await supabase
    .from('service_requests')
    .select('id, created_at, activity_type, last_audited_budget')
    .eq('status', 'open')
    .order('created_at', {ascending:false});

  const body = document.getElementById('reqBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لا توجد طلبات مفتوحة حالياً</td></tr>'; return; }

  body.innerHTML = data.map(r => `
    <tr>
      <td>#${esc(r.id.slice(0,8))}</td>
      <td>${esc(r.activity_type || '—')}</td>
      <td>${esc(r.last_audited_budget || '—')}</td>
      <td>
        <a href="submit-offer.html?request_id=${esc(r.id)}" class="btn" style="padding:7px 16px;font-size:12.5px;margin-top:0;">تقديم عرض تفصيلي</a>
      </td>
    </tr>`).join('');
}

async function loadOffers(){
  const area = document.getElementById('offersArea');
  const { data, error } = await supabase
    .from('offers')
    .select('id, price, duration_days, status, request_id, service_requests(activity_type)')
    .eq('provider_id', profile.id)
    .order('created_at', {ascending:false});

  if(error || !data || !data.length){ area.innerHTML = '<p class="txt-soft-lg">لم تقدّم أي عروض بعد.</p>'; return; }

  const statusMap = {submitted:'مُرسَل', accepted:'مقبول ✓', rejected:'مرفوض'};
  area.innerHTML = data.map(o => `
    <div class="card">
      <p style="font-size:14px;font-weight:700;margin-bottom:4px;">طلب #${esc(o.request_id.slice(0,8))} — ${esc(o.service_requests?.activity_type || '')}</p>
      <p class="hint mb-10">السعر: ${esc(o.price)} ر.س · المدة: ${esc(o.duration_days)} يوم · الحالة: ${statusMap[o.status]}</p>
      <a href="../offer-view.html?id=${esc(o.id)}" class="btn ghost btn-sm-flush">عرض تفاصيل العرض</a>
      <button class="btn ghost btn-sm-flush" onclick="toggleChat('${esc(o.id)}')">فتح المحادثة</button>
      ${o.status === 'accepted' ? `<button class="btn ghost btn-sm-flush" onclick="toggleStages('${esc(o.id)}','${esc(o.request_id)}')">متابعة المراحل</button>` : ''}
      ${o.status === 'accepted' ? `<button class="btn ghost btn-sm-flush" onclick="togglePayments('${esc(o.id)}')">إدارة الدفعات</button>` : ''}
      <div id="chat-${esc(o.id)}" class="is-hidden"></div>
      ${o.status === 'accepted' ? `<div id="stages-${esc(o.id)}" style="display:none;margin-top:10px;"></div>` : ''}
      ${o.status === 'accepted' ? `<div id="payments-${esc(o.id)}" style="display:none;margin-top:10px;"></div>` : ''}
    </div>
  `).join('');
}

function togglePayments(offerId){
  const el = document.getElementById(`payments-${offerId}`);
  const isHidden = getComputedStyle(el).display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(isHidden) loadPayments(offerId);
}

async function loadPayments(offerId){
  const el = document.getElementById(`payments-${offerId}`);
  const { data, error } = await supabase.from('offer_payments').select('*').eq('offer_id', offerId).order('created_at');

  let html = '<div class="card" style="background:var(--cream);">';
  if(error){ html += `<p class="msg err">${esc(error.message)}</p>`; }
  else if(!data || !data.length){ html += '<p class="hint">لا توجد دفعات مسجّلة بعد.</p>'; }
  else {
    data.forEach(p => {
      let statusText, statusColor;
      if(p.client_confirmed && p.provider_confirmed){ statusText = '✅ مؤكد من الطرفين'; statusColor = 'var(--green)'; }
      else if(p.provider_confirmed){ statusText = 'بانتظار تأكيد العميل'; statusColor = 'var(--gold)'; }
      else { statusText = 'بانتظار استلام الدفعة'; statusColor = 'var(--ink-soft)'; }

      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
        <div><strong class="txt-13">${esc(p.label)}</strong> — <span class="txt-12">${esc(p.amount)} ر.س</span><br><span style="font-size:11.5px;color:${esc(statusColor)};">${esc(statusText)}</span></div>
        ${!p.provider_confirmed ? `<button class="btn" style="padding:6px 12px;font-size:11px;margin-top:0;" onclick="confirmPaymentProvider('${esc(p.id)}','${esc(offerId)}')">تم استلام الدفعة</button>` : ''}
      </div>`;
    });
  }
  html += `
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input id="payLabel-${esc(offerId)}" placeholder="مثال: الدفعة الأولى" style="flex:1;">
      <input id="payAmount-${esc(offerId)}" type="number" placeholder="المبلغ" style="width:110px;">
      <button class="btn gold" style="margin:0;padding:9px 16px;" onclick="addPayment('${esc(offerId)}')">إضافة</button>
    </div>
  </div>`;
  el.innerHTML = html;
}

async function addPayment(offerId){
  const label = document.getElementById(`payLabel-${offerId}`).value.trim();
  const amount = parseFloat(document.getElementById(`payAmount-${offerId}`).value);
  if(!label || !amount){ alert('أدخل وصف الدفعة والمبلغ'); return; }
  const { error } = await supabase.from('offer_payments').insert({ offer_id: offerId, label, amount });
  if(error){ alert(error.message); return; }
  loadPayments(offerId);
  notifyOfferClient(offerId, 'دفعة جديدة بانتظار تأكيدك', label + ' — ' + amount + ' ر.س');
}

async function confirmPaymentProvider(paymentId, offerId){
  const { error } = await supabase.from('offer_payments').update({ provider_confirmed: true, provider_confirmed_at: new Date().toISOString() }).eq('id', paymentId);
  if(error){ alert(error.message); return; }
  loadPayments(offerId);
  notifyOfferClient(offerId, 'تم تأكيد استلام دفعتك ✓', null);
}

async function notifyOfferClient(offerId, title, body){
  const { data } = await supabase.from('offers').select('service_requests(client_id)').eq('id', offerId).single();
  const clientId = data?.service_requests?.client_id;
  if(clientId) createNotification(clientId, title, body, '../client/dashboard.html');
}

function toggleStages(offerId, requestId){
  const el = document.getElementById(`stages-${offerId}`);
  const isHidden = getComputedStyle(el).display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(isHidden){ el.innerHTML = '<p class="hint">جارٍ التحميل...</p>'; loadStages(requestId, `stages-${offerId}`, true); }
}

async function loadStages(requestId, containerId, canEdit){
  const container = document.getElementById(containerId);
  const { data: req } = await supabase.from('service_requests').select('id, created_at, status, client_id').eq('id', requestId).single();
  const { data: offersData } = await supabase.from('offers').select('created_at, status').eq('request_id', requestId).order('created_at');
  const { data: clientRow } = await supabase.from('clients').select('created_at, assessment_completed_at').eq('id', req.client_id).single();

  const autoStages = [
    { name:'تم التسجيل', done:true, date: clientRow?.created_at },
    { name:'تم اعتماد طلبه', done: !!clientRow?.assessment_completed_at, date: clientRow?.assessment_completed_at },
    { name:'تم الرفع للعروض', done: req.status !== 'pending_admin_review', date: req.created_at },
    { name:'تم إرسال عروض', done: !!(offersData && offersData.length), date: offersData?.[0]?.created_at },
    { name:'اعتماد العروض', done: !!(offersData && offersData.some(o=>o.status==='accepted')), date: offersData?.find(o=>o.status==='accepted')?.created_at },
  ];

  const { data: stages } = await supabase.from('request_stages').select('*').eq('request_id', requestId).order('stage_order');

  let html = '<div class="timeline">';
  autoStages.forEach(s => {
    html += `<div class="tl-item ${s.done?'done':''}"><span class="tl-dot"></span><div class="tl-text"><strong>${esc(s.name)}</strong>${s.date?` <span class="tl-date">${esc(new Date(s.date).toLocaleDateString('ar-SA'))}</span>`:''}</div></div>`;
  });
  if(stages && stages.length){
    stages.forEach(s => {
      const cls = s.status === 'completed' ? 'done' : (s.status==='in_progress' ? 'active' : '');
      let actionBtn = '';
      if(canEdit && s.status !== 'completed'){
        if(s.status === 'pending') actionBtn = `<button class="btn ghost" style="padding:5px 10px;font-size:11px;margin-top:4px;" onclick="updateStage('${esc(s.id)}','in_progress','${esc(requestId)}','${esc(containerId)}',${esc(canEdit)})">بدء المرحلة</button>`;
        else actionBtn = `<button class="btn" style="padding:5px 10px;font-size:11px;margin-top:4px;" onclick="updateStage('${esc(s.id)}','completed','${esc(requestId)}','${esc(containerId)}',${esc(canEdit)})">إنهاء المرحلة</button>`;
      }
      html += `<div class="tl-item ${esc(cls)}"><span class="tl-dot"></span><div class="tl-text"><strong>${esc(s.stage_name)}</strong>${s.completed_at?` <span class="tl-date">${esc(new Date(s.completed_at).toLocaleDateString('ar-SA'))}</span>`:''}<br>${actionBtn}</div></div>`;
    });
  } else {
    html += '<p class="txt-soft-sm">لم تبدأ مراحل التنفيذ بعد.</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

async function updateStage(stageId, newStatus, requestId, containerId, canEdit){
  const payload = { status: newStatus };
  if(newStatus==='in_progress') payload.started_at = new Date().toISOString();
  if(newStatus==='completed') payload.completed_at = new Date().toISOString();
  const { data: stageRow, error } = await supabase.from('request_stages').update(payload).eq('id', stageId).select().single();
  if(error){ alert(error.message); return; }

  if(newStatus === 'completed' && stageRow.stage_order === 8){
    await supabase.from('service_requests').update({ status: 'completed' }).eq('id', requestId);
  }

  loadStages(requestId, containerId, canEdit);
}

function toggleChat(offerId){
  const el = document.getElementById(`chat-${offerId}`);
  const isHidden = getComputedStyle(el).display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(isHidden) renderChat(offerId);
}

async function renderChat(offerId){
  const el = document.getElementById(`chat-${offerId}`);
  el.innerHTML = `<div class="chat-box"><div class="chat-msgs" id="msgs-${esc(offerId)}">جارٍ التحميل...</div>
    <div class="chat-input-row"><input id="input-${esc(offerId)}" placeholder="اكتب رسالة..."><button class="btn" style="margin:0;padding:8px 16px;" onclick="sendMessage('${esc(offerId)}')">إرسال</button></div></div>`;
  loadMessages(offerId);
}

async function loadMessages(offerId){
  const { data, error } = await supabase.from('messages').select('*').eq('offer_id', offerId).order('created_at');
  const box = document.getElementById(`msgs-${offerId}`);
  if(error){ box.innerHTML = `<p class="msg err">${esc(error.message)}</p>`; return; }
  if(!data || !data.length){ box.innerHTML = '<p class="hint">لا توجد رسائل بعد.</p>'; return; }
  box.innerHTML = data.map(m => `<div class="chat-msg ${m.sender_id === profile.id ? 'mine' : 'theirs'}">${esc(m.message)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(offerId){
  const input = document.getElementById(`input-${offerId}`);
  const text = input.value.trim();
  if(!text) return;
  const { error } = await supabase.from('messages').insert({ offer_id: offerId, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadMessages(offerId);
  notifyOfferClient(offerId, 'رسالة جديدة من مقدّم الخدمة', text.slice(0,60));
}

async function uploadProviderDoc(){
  const fileInput = document.getElementById('doc_file');
  const doc_type = document.getElementById('doc_type').value;
  const msg = document.getElementById('uploadMsg');
  if(!fileInput.files.length){ msg.className='msg err'; msg.textContent='اختر ملفاً أولاً'; return; }

  const file = fileInput.files[0];
  const _v = validateUpload(file); if(!_v.ok){ alert(_v.reason); return; } const safeName = safeFileName(file.name);
  const filePath = `${profile.id}/${Date.now()}_${safeName}`;

  const { error: upErr } = await supabase.storage.from('provider-documents').upload(filePath, file);
  if(upErr){ msg.className='msg err'; msg.textContent = upErr.message; return; }

  const { error: dbErr } = await supabase.from('provider_documents').insert({
    provider_id: profile.id, doc_type, file_path: filePath
  });
  if(dbErr){ msg.className='msg err'; msg.textContent = dbErr.message; return; }

  msg.className='msg ok'; msg.textContent='تم رفع المستند بنجاح';
  fileInput.value = '';
  loadProviderDocs();
}

async function loadProviderDocs(){
  const { data, error } = await supabase.from('provider_documents').select('*').eq('provider_id', profile.id).order('uploaded_at', {ascending:false});
  const body = document.getElementById('docsBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="3">لا توجد مستندات مرفوعة بعد</td></tr>'; return; }
  const statusMap = {pending:'<span class="badge pending">قيد المراجعة</span>', verified:'<span class="badge ready">تم التحقق</span>', rejected:'<span class="badge notready">مرفوض</span>'};
  body.innerHTML = data.map(d => `<tr><td>${esc(d.doc_type)}</td><td>${esc(new Date(d.uploaded_at).toLocaleDateString('ar-SA'))}</td><td>${statusMap[d.status]}</td></tr>`).join('');
}

init();
</script>
</body>
</html>
